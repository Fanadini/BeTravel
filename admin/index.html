<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>Be•Travel — Inicio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="../favicon-512.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#0F3D3E;--teal-h:#0c3233;--beige:#E6E1D8;--beige-d:#D5CEC3;--bronze:#B08A5A;--dark:#2B2B2B;--white:#fff;--red:#b83232;--green:#2f8f4e;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',sans-serif;background:var(--beige);color:var(--dark);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}

/* ── Encabezado ── */
.top{background:var(--teal);color:var(--beige);padding:calc(var(--sat) + 16px) calc(var(--sar) + 20px) 22px calc(var(--sal) + 20px)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:760px;margin:0 auto}
.brand{font-size:20px;font-weight:600;letter-spacing:-.4px}
.brand span{color:var(--bronze)}
.out{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;padding:8px 14px;border-radius:8px;border:1px solid rgba(230,225,216,.3);background:transparent;color:rgba(230,225,216,.85);cursor:pointer}
.hola{max-width:760px;margin:18px auto 0;font-size:14px;color:rgba(230,225,216,.75)}
.hola strong{display:block;font-size:22px;font-weight:600;color:var(--beige);letter-spacing:-.4px;margin-top:2px}

/* ── Contenido ── */
.wrap{max-width:760px;margin:0 auto;padding:18px calc(var(--sar) + 16px) calc(var(--sab) + 32px) calc(var(--sal) + 16px)}
.sec-t{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:rgba(43,43,43,.5);margin:6px 2px 10px}
.res{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:22px}
.rc{background:var(--white);border:1px solid var(--beige-d);border-radius:14px;padding:14px 16px}
.rc h3{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--teal);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.rc h3 em{font-style:normal;font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--white);background:var(--teal);border-radius:99px;padding:2px 9px}
.rc h3 em.alerta{background:var(--red)}
.rc ul{list-style:none;display:grid;gap:6px}
.rc li{font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;line-height:1.35}
.rc li small{color:rgba(43,43,43,.55);white-space:nowrap;font-size:12px}
.cal{background:var(--white);border:1px solid var(--beige-d);border-radius:14px;padding:12px;margin-top:10px}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cal-h b{font-size:14px;color:var(--teal);text-align:center;flex:1}
.cal-h button{font-family:'Inter',sans-serif;font-size:14px;color:var(--teal);background:var(--beige);border:1px solid var(--beige-d);border-radius:8px;min-width:34px;height:32px;cursor:pointer}
.cal-h button.hoy{font-size:11px;padding:0 10px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-w{text-align:center;font-size:10px;font-weight:600;color:rgba(43,43,43,.5);padding:2px 0;text-transform:uppercase}
.cal-d{border:1px solid transparent;background:transparent;font-family:'Inter',sans-serif;font-size:12px;color:var(--dark);border-radius:8px;min-height:42px;padding:4px 0 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.cal-d.vacio{cursor:default}
.cal-d.hoy{box-shadow:inset 0 0 0 2px var(--bronze,#B08A5A)}
.cal-d.sel{background:var(--teal);color:var(--white)}
.cal-p{display:flex;gap:2px;height:6px}
.cal-p i{width:6px;height:6px;border-radius:99px;background:var(--teal);display:block}
.cal-p i.b{background:#C97A1A}
.cal-p i.t{background:var(--red,#B83232)}
.cal-d.sel .cal-p i{outline:1px solid var(--white)}
.cal-l{margin-top:10px;display:grid;gap:4px}
.cal-l a{display:block;font-size:13px;padding:7px 9px;border-radius:8px;background:var(--beige);color:var(--teal);text-decoration:none;line-height:1.3}
.cal-l a.b{background:rgba(201,122,26,.14);color:#C97A1A}
.cal-l a.t{background:rgba(184,50,50,.12);color:var(--red,#B83232)}
.cal-l .nada{font-size:13px;color:rgba(43,43,43,.55)}
.cal-f{display:block;margin-top:8px;font-size:12px;color:var(--teal)}
.bus{position:relative;margin:0 0 18px}
.bus input{width:100%;font-family:'Inter',sans-serif;font-size:15px;color:var(--dark);background:var(--white);border:1px solid var(--beige-d);border-radius:12px;padding:12px 14px;outline:none}
.bus input:focus{border-color:var(--teal)}
.bus-r{margin-top:8px;background:var(--white);border:1px solid var(--beige-d);border-radius:14px;padding:8px 6px;display:grid;gap:2px;max-height:60vh;overflow-y:auto}
.bus-r h4{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:rgba(43,43,43,.5);margin:8px 8px 2px}
.bus-r a{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px;border-radius:8px;color:var(--dark);text-decoration:none;font-size:14px;line-height:1.3}
.bus-r a:active,.bus-r a:hover{background:var(--beige)}
.bus-r a small{color:rgba(43,43,43,.55);font-size:12px;text-align:right}
.bus-r .nada{font-size:13px;color:rgba(43,43,43,.55);padding:8px}
.rc li a.it{display:flex;justify-content:space-between;gap:10px;width:100%;color:inherit;text-decoration:none;padding:4px 6px;margin:0 -6px;border-radius:8px;line-height:1.35}
.rc li a.it:active,.rc li a.it:hover{background:var(--beige)}
.rc li a.it span{min-width:0;overflow-wrap:anywhere}
.rc h3 a.vt{font-size:11px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--teal);text-decoration:underline;margin-left:auto;margin-right:6px}
.rc .mas{display:block;margin-top:8px;font-size:12px;color:var(--teal)}
.rc .grp{font-size:11px;color:var(--teal);text-decoration:underline;margin-left:6px;white-space:nowrap}
.rc .nada{font-size:13px;color:rgba(43,43,43,.55)}
.rc .monto{font-size:20px;font-weight:600;color:var(--teal);letter-spacing:-.3px}
.rc .monto + .monto{margin-top:2px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--white);border:1px solid var(--beige-d);border-radius:16px;padding:16px 14px;display:flex;flex-direction:column;gap:10px;color:var(--dark);text-decoration:none;min-height:116px;transition:transform .12s,border-color .12s}
.card:active{transform:scale(.97);border-color:var(--teal)}
.card svg{width:30px;height:30px;stroke:var(--teal);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.card b{font-size:15px;font-weight:600;letter-spacing:-.2px;color:var(--teal);display:block}
.card small{font-size:12px;color:rgba(43,43,43,.6);line-height:1.35;display:block;margin-top:2px}
.card.ancho{grid-column:1/-1;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.chip{font-size:13px;font-weight:500;color:var(--teal);background:var(--beige);border:1px solid var(--beige-d);border-radius:99px;padding:8px 14px;text-decoration:none}
.chip:active{background:var(--teal);color:var(--beige)}
.card.gi{cursor:default;padding-bottom:14px}
.card.gi .cab{display:flex;gap:12px;align-items:center;color:inherit;text-decoration:none}

/* ── Ingreso ── */
.login{position:fixed;inset:0;background:var(--teal);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.login-box{background:var(--white);border-radius:18px;padding:34px 26px;width:100%;max-width:360px;text-align:center}
.login-box .brand{color:var(--teal);font-size:24px}
.login-box p{font-size:13px;color:rgba(43,43,43,.6);margin:6px 0 24px}
.g-btn{width:100%;padding:14px;border-radius:10px;border:1.5px solid var(--beige-d);background:var(--white);font-family:'Inter',sans-serif;font-size:14px;font-weight:500;color:var(--dark);cursor:pointer}
.g-btn:active{background:var(--beige)}
.err{font-size:12px;color:var(--red);margin-top:14px;min-height:16px;line-height:1.4}
.spin{position:fixed;inset:0;background:var(--teal);display:flex;align-items:center;justify-content:center;z-index:60}
.spin i{width:30px;height:30px;border-radius:50%;border:3px solid rgba(230,225,216,.2);border-top-color:var(--bronze);animation:g .7s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.aviso{background:rgba(184,50,50,.08);border:1px solid rgba(184,50,50,.3);color:var(--red);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.45;margin-bottom:14px}
@media(min-width:640px){.res{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<div class="spin" id="spin"><i></i></div>

<div class="login hidden" id="login">
  <div class="login-box">
    <div class="brand">Be<span>•</span>Travel</div>
    <p>Ingresá con tu cuenta de Google para ver tus herramientas.</p>
    <button class="g-btn" onclick="ingresar()">Continuar con Google</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="top-row"><div class="brand">Be<span>•</span>Travel</div><button class="out" onclick="salir()">Salir</button></div>
    <div class="hola">Hola<strong id="nombre"></strong></div>
  </header>
  <main class="wrap">
    <div class="aviso hidden" id="aviso"></div>
    <div class="bus hidden" id="bus"><input id="bus-q" type="search" placeholder="Buscar reservas, grupos, pasajeros, cotizaciones…" autocomplete="off" oninput="buscar(this.value)" onfocus="cargarBusqueda()"><div id="bus-r" class="bus-r hidden"></div></div>
    <div class="sec-t">Herramientas</div>
    <div class="grid" id="botones" style="margin-bottom:24px"></div>
    <section id="resumen" class="hidden">
      <div class="sec-t">Resumen</div>
      <div class="res" id="res"></div>
      <div class="sec-t" style="margin-top:18px">Calendario</div>
      <div class="cal" id="cal"></div>
    </section>
  </main>
</div>

<script src="nav.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyARJ-zVCszUxJ_Fs1UBBtMiQvjuDF98IYI",
  authDomain:"betravel-kanban.firebaseapp.com",
  databaseURL:"https://betravel-kanban-default-rtdb.firebaseio.com",
  projectId:"betravel-kanban",
  storageBucket:"betravel-kanban.firebasestorage.app",
  messagingSenderId:"644328296494",
  appId:"1:644328296494:web:aec3842de80021159f8fbf",
});
const db = firebase.database(), auth = firebase.auth();
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const emailKey = e => (e || '').toLowerCase().replace(/\./g, ',');

// ── Ingreso con Google ─────────────────────────────────────────────────────
// En una app instalada en el iPhone la ventana emergente de Google a veces no abre: si falla, se pasa a la redirección.
function ingresar(){
  $('login-err').textContent = '';
  const p = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(p).catch(err => {
    console.error(err);
    if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(err.code)){
      $('login-err').textContent = 'Abriendo el ingreso de Google en esta pantalla…';
      auth.signInWithRedirect(p).catch(e => { $('login-err').textContent = 'No se pudo iniciar sesión. Probá abrir esta página en Safari, ingresar una vez y volver a la app.'; console.error(e); });
    } else $('login-err').textContent = 'No se pudo iniciar sesión. Intentá de nuevo.';
  });
}
function salir(){ auth.signOut(); }
if (auth.getRedirectResult) auth.getRedirectResult().catch(err => { console.error(err); $('login-err').textContent = 'No se pudo completar el ingreso. Intentá de nuevo.'; });

// ── Herramientas por rol (las mismas secciones del encabezado de cada página) ──
const INFO = {
  kanban:      { sub:'Pipeline comercial', svg:'<rect x="3" y="4" width="5" height="16" rx="1.2"/><rect x="9.5" y="4" width="5" height="10" rx="1.2"/><rect x="16" y="4" width="5" height="13" rx="1.2"/>' },
  cotizador:   { sub:'Cotizaciones y propuestas', svg:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/>' },
  gestion:     { sub:'Reservas, pagos y recibos', svg:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M3 13h18"/>' },
  grupos:      { sub:'Pasajeros y habitaciones', svg:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14.2c2.6.2 4.5 2.3 4.5 4.8"/>' },
  compartidas: { sub:'Mis reservas, pasajeros y recibos', svg:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="2.4"/>' },
  contratos:   { sub:'Contratos de grupo', svg:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 17c1.2-2.4 2.3-3.2 3-3.2.8 0 .3 2.2 1.2 2.2.7 0 1.2-1 1.8-1"/>' }
};
const ATAJOS = [['reservas', 'Reservas'], ['pasajeros', 'Pasajeros'], ['recibos', 'Recibos'], ['recordatorios', 'Recordatorios']];
let ROL = '', GRUPOS_OK = false;
function botones(){
  const secs = (AdminNav.secciones || []).filter(s => s.id !== 'inicio' && INFO[s.id] && (s.roles.indexOf(ROL) !== -1 || (s.id === 'grupos' && GRUPOS_OK)));
  $('botones').innerHTML = secs.map(s => {
    const i = INFO[s.id], ico = `<svg viewBox="0 0 24 24" aria-hidden="true">${i.svg}</svg>`;
    if (s.id === 'gestion') return `<div class="card gi ancho"><a class="cab" href="${esc(s.href)}">${ico}<div><b>${esc(s.label)}</b><small>${esc(i.sub)}</small></div></a><div class="chips">${ATAJOS.map(a => `<a class="chip" href="${esc(s.href)}#${a[0]}">${a[1]}</a>`).join('')}</div></div>`;
    return `<a class="card" href="${esc(s.href)}">${ico}<div><b>${esc(s.label)}</b><small>${esc(i.sub)}</small></div></a>`;
  }).join('');
}

// ── Resumen (solo admin y agente: leen las reservas y los recordatorios) ────
let RES = {}, REC = {}, PROVS = {}, IDXG = {}, PAXS = {}, CAL_MES = '', CAL_DIA = '';
const hoyISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const dias = f => f ? Math.round((new Date(f + 'T00:00:00') - new Date(hoyISO() + 'T00:00:00')) / 86400000) : null;
const arr = o => !o ? [] : Array.isArray(o) ? o.filter(Boolean) : Object.keys(o).map(id => ({ id, ...o[id] }));
const fmt = (n, m) => (m === 'USD' ? 'US$ ' : '$ ') + (Number(n) || 0).toLocaleString('de-DE', { maximumFractionDigits:0 });
function conv(monto, de, a, tc){
  if (!de || de === a) return monto;
  const t = Number(tc) || 0; if (t <= 0) return 0;
  return a === 'USD' && de === 'ARS' ? monto / t : a === 'ARS' && de === 'USD' ? monto * t : monto;
}
// Misma cuenta que "Saldo pendiente" de Gestión interna: valor cotizado - pagos - lo cobrado directo por ejecutivos
function saldo(r){
  const m = r.moneda || 'ARS';
  const cot = arr(r.cotizado).reduce((s, c) => s + conv(Number(c.monto) || 0, c.moneda || m, m, c.tipoCambio), 0);
  const pag = arr(r.pagos).reduce((s, p) => s + conv(Number(p.monto) || 0, p.moneda || m, m, p.tipoCambio), 0);
  const dir = arr(r.reparto).reduce((s, x) => s + conv(Number(x.montoCobradoDirecto) || 0, x.moneda || m, m, x.tipoCambio), 0);
  return cot - pag - dir;
}
function pintarResumen(){
  const rs = Object.keys(RES).map(id => ({ id, ...RES[id] })), rc = Object.keys(REC).map(id => ({ id, ...REC[id] }));
  const venc = rc.filter(x => !x.resuelto && x.tipo !== 'Tarjeta' && x.fecha && dias(x.fecha) <= 0).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const salidas = rs.filter(r => ['aceptado', 'pagado'].includes(r.estado) && r.fechaInicio && dias(r.fechaInicio) >= 0 && dias(r.fechaInicio) <= 30).sort((a, b) => a.fechaInicio.localeCompare(b.fechaInicio));
  const tot = { ARS:0, USD:0 }, conSaldo = []; let n = 0;
  rs.filter(r => r.estado === 'aceptado').forEach(r => { const s = saldo(r); if (s > 0.5){ tot[r.moneda === 'USD' ? 'USD' : 'ARS'] += s; n++; conSaldo.push({ r, s }); } });
  conSaldo.sort((a, b) => b.s - a.s);
  const cuando = d => d === 0 ? 'hoy' : d === 1 ? 'mañana' : `en ${d} días`;
  const hrefRes = r => `gestioninterna.html?reserva=${encodeURIComponent(r.id)}`, hrefGrupo = gid => `grupos.html?g=${encodeURIComponent(gid)}`;
  const lista = (items, vacio, f, max) => items.length ? `<ul>${items.slice(0, max || 3).map(f).join('')}</ul>` : `<div class="nada">${vacio}</div>`;
  const mas = (items, max, href, txt) => items.length > (max || 3) ? `<a class="mas" href="${href}">${txt || 'Ver todos'} (${items.length})</a>` : '';
  const vt = (href, txt) => `<a class="vt" href="${href}">${txt || 'Ver'}</a>`;
  // Cuotas de proveedores por pagar: vencidas y de los próximos 15 días
  const pagos = [];
  Object.keys(PROVS).forEach(gid => Object.keys(PROVS[gid] || {}).forEach(pid => { const p = PROVS[gid][pid] || {}; Object.keys(p.cuotas || {}).forEach(cid => { const c = p.cuotas[cid] || {}; if (c.pagado || !c.fecha || dias(c.fecha) > 15) return;
    const v = (c.monto != null && c.monto !== '') ? Number(c.monto) || 0 : (Number(p.total) || 0) * (Number(c.pct) || 0) / 100;
    pagos.push({ gid, nombre: p.nombre || 'Proveedor', grupo: (IDXG[gid] || {}).nombre || '', fecha: c.fecha, mon: p.moneda || 'USD', v }); }); }));
  pagos.sort((a, b) => a.fecha.localeCompare(b.fecha));
  const atras = pagos.filter(x => dias(x.fecha) < 0).length;
  $('res').innerHTML =
    (ROL === 'cotizador' ? '' : `<div class="rc"><h3>Recordatorios <em class="${venc.length ? 'alerta' : ''}">${venc.length}</em>${vt('gestioninterna.html#recordatorios', 'Abrir')}</h3>${lista(venc, 'Nada vencido ni para hoy.', x => { const d = dias(x.fecha); return `<li><a class="it" href="gestioninterna.html#recordatorios"><span>${esc(x.titulo || x.tipo || 'Recordatorio')}</span><small>${d < 0 ? 'vencido hace ' + (-d) + (d === -1 ? ' día' : ' días') : 'hoy'}</small></a></li>`; })}${mas(venc, 3, 'gestioninterna.html#recordatorios')}</div>`)
    + `<div class="rc"><h3>Próximas salidas <em>${salidas.length}</em>${vt('gestioninterna.html#calendario', 'Calendario')}</h3>${lista(salidas, 'Sin salidas en los próximos 30 días.', r => `<li><a class="it" href="${hrefRes(r)}"><span>${esc(r.codigo || '')} ${esc(r.cliente || '')}</span><small>${cuando(dias(r.fechaInicio))}</small></a>${r.grupoId ? `<a class="grp" href="${hrefGrupo(r.grupoId)}">Grupo</a>` : ''}</li>`, 5)}${mas(salidas, 5, 'gestioninterna.html#calendario', 'Ver en el calendario')}</div>`
    + `<div class="rc"><h3>Saldo a cobrar <em>${n}</em>${vt('gestioninterna.html#cartera', 'Cartera')}</h3>${(tot.USD || tot.ARS) ? (tot.USD ? `<div class="monto">${fmt(tot.USD, 'USD')}</div>` : '') + (tot.ARS ? `<div class="monto">${fmt(tot.ARS, 'ARS')}</div>` : '') + `<div class="nada" style="margin:4px 0 8px">${n} reserva${n === 1 ? '' : 's'} aceptada${n === 1 ? '' : 's'} con saldo</div>` + `<ul>${conSaldo.slice(0, 3).map(x => `<li><a class="it" href="${hrefRes(x.r)}"><span>${esc(x.r.codigo || '')} ${esc(x.r.cliente || '')}</span><small>${fmt(x.s, x.r.moneda === 'USD' ? 'USD' : 'ARS')}</small></a></li>`).join('')}</ul>${mas(conSaldo, 3, 'gestioninterna.html#cartera')}` : '<div class="nada">Sin saldos pendientes.</div>'}</div>`
    + (Object.keys(PROVS).length ? `<div class="rc"><h3>Pagos a proveedores <em class="${atras ? 'alerta' : ''}">${pagos.length}</em></h3>${lista(pagos, 'Nada vencido ni en los próximos 15 días.', x => { const d = dias(x.fecha); return `<li><a class="it" href="${hrefGrupo(x.gid)}"><span>${esc(x.nombre)}${x.grupo ? ' · ' + esc(x.grupo) : ''}</span><small>${fmt(x.v, x.mon)} · ${d < 0 ? 'vencida' : d === 0 ? 'hoy' : cuando(d)}</small></a></li>`; }, 4)}${mas(pagos, 4, 'grupos.html', 'Ver en Grupos')}</div>` : '');
  ajustarLinksCot($('res'));
  $('resumen').classList.remove('hidden');
  pintarCalendario();
}
// Cuenta cotizador con acceso a Grupos: solo las reservas que le compartieron y los compromisos de los grupos que ve
let REFS_COT = {};
// La cuenta cotizador no entra a Gestión interna: sus reservas (propias y compartidas) se ven en "Mis reservas"
function ajustarLinksCot(raiz){
  if (ROL !== 'cotizador' || !raiz) return;
  raiz.querySelectorAll('a[href^="gestioninterna.html"]').forEach(a => { if (/#calendario$/.test(a.getAttribute('href')) && a.classList.contains('cal-f')) a.remove(); else a.setAttribute('href', 'mis-reservas.html'); });
}
function escucharResumenCot(email){
  let propias = new Set();
  db.ref('finanzas/reservas').orderByChild('creadoPor').equalTo(email).on('value', snap => {
    const v = snap.val() || {};
    [...propias].forEach(id => { if (!v[id] && !REFS_COT[id]) delete RES[id]; });
    propias = new Set(Object.keys(v)); Object.keys(v).forEach(id => { RES[id] = v[id]; });
    pintarResumen();
  }, () => {});
  db.ref('finanzas/reservasCompartidas/' + emailKey(email)).on('value', snap => {
    const v = snap.val() || {}, ids = Object.keys(v).filter(k => v[k] === true);
    ids.forEach(id => { if (REFS_COT[id]) return; REFS_COT[id] = db.ref('finanzas/reservas/' + id); REFS_COT[id].on('value', s => { s.exists() ? RES[id] = s.val() : delete RES[id]; pintarResumen(); }, () => { delete RES[id]; pintarResumen(); }); });
    Object.keys(REFS_COT).filter(id => !ids.includes(id)).forEach(id => { REFS_COT[id].off(); delete REFS_COT[id]; delete RES[id]; });
    pintarResumen();
  }, () => { pintarResumen(); });
  db.ref('finanzas/compromisosGrupo').on('value', s => { PROVS = s.val() || {}; pintarResumen(); }, () => {});
  db.ref('gruposIndex').on('value', s => { IDXG = s.val() || {}; pintarResumen(); }, () => {});
}
function escucharResumen(){
  db.ref('finanzas/reservas').on('value', s => { RES = s.val() || {}; pintarResumen(); }, () => {});
  db.ref('finanzas/recordatorios').on('value', s => { REC = s.val() || {}; pintarResumen(); }, () => {});
  db.ref('finanzas/compromisosGrupo').on('value', s => { PROVS = s.val() || {}; pintarResumen(); }, () => {});
  db.ref('finanzas/pasajeros').on('value', s => { PAXS = s.val() || {}; pintarResumen(); }, () => {});
  db.ref('gruposIndex').on('value', s => { IDXG = s.val() || {}; pintarResumen(); }, () => {});
}


// ── Buscador global: reservas, grupos, pasajeros de grupos y cotizaciones ──────
const normB = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
let BUS_COT = {}, BUS_GRP = {}, BUS_CARGADO = false;
function cargarBusqueda(){
  if (BUS_CARGADO) return; BUS_CARGADO = true;
  if (ROL !== 'cotizador') db.ref('finanzas/cotizaciones').once('value').then(s => { BUS_COT = s.val() || {}; buscar($('bus-q').value); }, () => {});
  db.ref('grupos').once('value').then(s => { BUS_GRP = s.val() || {}; buscar($('bus-q').value); }, () => {});
}
function buscar(q){
  const box = $('bus-r'), toks = normB(q).split(' ').filter(Boolean);
  if (!toks.length){ box.classList.add('hidden'); box.innerHTML = ''; return; }
  const ok = txt => { const n = normB(txt); return toks.every(t => n.includes(t)); };
  const sec = (t, items) => items.length ? `<h4>${t}</h4>` + items.slice(0, 5).map(x => `<a href="${x.href}"><span>${x.t}</span><small>${x.s || ''}</small></a>`).join('') : '';
  const reservas = Object.keys(RES).map(id => ({ id, ...RES[id] })).filter(r => ok([r.codigo, r.cliente, r.destino, r.titulo].join(' '))).map(r => ({ href: `gestioninterna.html?reserva=${encodeURIComponent(r.id)}`, t: esc(`${r.codigo || ''} ${r.cliente || ''}`.trim() || 'Reserva'), s: esc(r.estado || '') }));
  const grupos = Object.keys(IDXG).filter(id => ok((IDXG[id] || {}).nombre)).map(id => ({ href: `grupos.html?g=${encodeURIComponent(id)}`, t: esc(IDXG[id].nombre || id), s: 'Grupo' }));
  const pax = [];
  Object.keys(BUS_GRP).forEach(gid => { const g = BUS_GRP[gid] || {}, rs = g.respuestas || {};
    Object.keys(rs).forEach(rid => { const r = rs[rid] || {}; if (ok([r.nombre, r.apellido, r.pasaporte, r.email].join(' '))) pax.push({ href: `grupos.html?g=${encodeURIComponent(gid)}&q=${encodeURIComponent(`${r.apellido || ''} ${r.nombre || ''}`.trim())}`, t: esc(`${r.apellido || ''}, ${r.nombre || ''}`), s: esc((g.meta || {}).nombre || '') }); }); });
  const cots = Object.keys(BUS_COT).map(id => ({ id, ...BUS_COT[id] })).filter(c => ok([c.codigo, c.cliente, c.titulo, c.destino].join(' '))).map(c => ({ href: `cotizador.html?c=${encodeURIComponent(c.id)}`, t: esc(`${c.codigo || ''} ${c.cliente || c.titulo || ''}`.trim() || 'Cotización'), s: 'Cotización' }));
  const h = sec('Reservas', reservas) + sec('Grupos', grupos) + sec('Pasajeros', pax) + sec('Cotizaciones', cots);
  box.innerHTML = h || '<div class="nada">Sin resultados.</div>'; box.classList.remove('hidden'); ajustarLinksCot(box);
}


// ── Mini calendario: misma información que el calendario de Gestión interna ────
const MESES_L = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function eventosCal(){
  const ev = {}, add = (f, o) => { (ev[f] = ev[f] || []).push(o); };
  const fmtM = (n, m) => fmt(n, m === 'USD' ? 'USD' : 'ARS');
  Object.keys(RES).forEach(id => { const r = { id, ...RES[id] };
    if (r.estado === 'cancelado' || r.estado === 'perdida') return;
    if (r.fechaInicio){
      const pid = Object.keys(r.pasajeroIds || {})[0], px = pid ? PAXS[pid] : null, pn = px ? `${(px.nombre || '').trim()} ${(px.apellido || '').trim()}`.trim() : '';
      const label = [r.concepto, pn].filter(Boolean).join(' · ') || r.codigo || r.cliente || '—';
      const fin = r.fechaFin && r.fechaFin >= r.fechaInicio ? r.fechaFin : r.fechaInicio;
      for (let d = new Date(r.fechaInicio + 'T00:00:00'), n = 0; d <= new Date(fin + 'T00:00:00') && n < 62; d.setDate(d.getDate() + 1), n++){
        const f = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        add(f, { k:'r', t: label, href: `gestioninterna.html?reserva=${encodeURIComponent(r.id)}` });
      }
    }
    arr(r.costos).forEach(c => { if (c.medio === 'tarjeta' && !c.pagado && c.fechaVencimiento) add(c.fechaVencimiento, { k:'t', t: `Vence tarjeta · ${c.proveedor || 'Sin proveedor especificado'}`, href: `gestioninterna.html?reserva=${encodeURIComponent(r.id)}` }); });
  });
  Object.keys(REC).forEach(id => { const x = REC[id] || {}; if (x.tipo === 'BSP' && !x.resuelto && x.fecha) add(x.fecha, { k:'b', t: `Vence BSP · ${fmtM(x.monto, x.moneda)}`, href: 'gestioninterna.html#recordatorios' }); });
  return ev;
}
function calMes(d){ const [y, m] = CAL_MES.split('-').map(Number), n = new Date(y, m - 1 + d, 1); CAL_MES = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}`; CAL_DIA = ''; pintarCalendario(); }
function calHoy(){ CAL_MES = hoyISO().slice(0, 7); CAL_DIA = hoyISO(); pintarCalendario(); }
function calDia(f){ CAL_DIA = f; pintarCalendario(); }
function pintarCalendario(){
  const box = $('cal'); if (!box) return;
  const hoy = hoyISO(); if (!CAL_MES) CAL_MES = hoy.slice(0, 7);
  const [y, m] = CAL_MES.split('-').map(Number), ev = eventosCal(), vacios = new Date(y, m - 1, 1).getDay(), n = new Date(y, m, 0).getDate();
  if (!CAL_DIA) CAL_DIA = hoy.slice(0, 7) === CAL_MES ? hoy : '';
  let celdas = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'].map(x => `<div class="cal-w">${x}</div>`).join('') + '<div class="cal-d vacio" style="visibility:hidden"></div>'.repeat(vacios);
  for (let d = 1; d <= n; d++){
    const f = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`, it = ev[f] || [], ks = ['r', 'b', 't'].filter(k => it.some(x => x.k === k));
    celdas += `<button type="button" class="cal-d${f === hoy ? ' hoy' : ''}${f === CAL_DIA ? ' sel' : ''}" onclick="calDia('${f}')" aria-label="${d} de ${MESES_L[m - 1]}${it.length ? ', ' + it.length + ' eventos' : ''}">${d}<span class="cal-p">${ks.map(k => `<i class="${k === 'r' ? '' : k}"></i>`).join('')}</span></button>`;
  }
  const dia = CAL_DIA && CAL_DIA.slice(0, 7) === CAL_MES ? (ev[CAL_DIA] || []) : null;
  const tit = CAL_DIA ? new Date(CAL_DIA + 'T00:00:00').toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long' }) : '';
  box.innerHTML = `<div class="cal-h"><button type="button" onclick="calMes(-1)" aria-label="Mes anterior">‹</button><b>${MESES_L[m - 1]} ${y}</b><button type="button" class="hoy" onclick="calHoy()">Hoy</button><button type="button" onclick="calMes(1)" aria-label="Mes siguiente">›</button></div><div class="cal-g">${celdas}</div>`
    + (dia ? `<div class="cal-l"><div class="nada" style="font-weight:600;color:var(--teal)">${esc(tit.charAt(0).toUpperCase() + tit.slice(1))}</div>${dia.length ? dia.map(x => `<a class="${x.k === 'r' ? '' : x.k}" href="${x.href}">${esc(x.t)}</a>`).join('') : '<div class="nada">Sin eventos este día.</div>'}</div>` : '')
    + '<a class="cal-f" href="gestioninterna.html#calendario">Abrir el calendario completo</a>';
  ajustarLinksCot(box);
}

// ── Sesión ─────────────────────────────────────────────────────────────────
let escuchando = false;
auth.onAuthStateChanged(user => {
  $('spin').classList.add('hidden');
  if (!user){ $('app').classList.add('hidden'); $('login').classList.remove('hidden'); return; }
  $('login').classList.add('hidden');
  db.ref('finanzas/meta/usuarios/' + emailKey(user.email)).once('value').then(s => {
    $('app').classList.remove('hidden');
    $('nombre').textContent = ' ' + (((s.val() || {}).nombre) || (user.displayName || user.email).split(' ')[0]);
    if (!s.exists()){
      $('aviso').innerHTML = `La cuenta <strong>${esc(user.email)}</strong> no está habilitada para el panel interno. Pedile a un administrador que la agregue a la lista de usuarios, o salí y entrá con otra cuenta.`;
      $('aviso').classList.remove('hidden'); $('botones').innerHTML = ''; return;
    }
    const perfil = s.val() || {};
    ROL = perfil.rol || 'agente'; GRUPOS_OK = perfil.grupos === true;
    botones();
    if (ROL !== 'cotizador') $('bus').classList.remove('hidden');
    if (ROL !== 'cotizador' && !escuchando){ escuchando = true; escucharResumen(); }
    if (ROL === 'cotizador' && GRUPOS_OK && !escuchando){ escuchando = true; $('bus').classList.remove('hidden'); escucharResumenCot(user.email); }
  }, () => {
    $('app').classList.remove('hidden');
    $('aviso').textContent = 'No se pudo leer tu perfil. Revisá la conexión e intentá de nuevo.'; $('aviso').classList.remove('hidden');
  });
});
</script>
