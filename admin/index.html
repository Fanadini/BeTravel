<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F3D3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Be•Travel">
<title>Be•Travel — Inicio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="../favicon-512.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#0F3D3E;--teal-h:#0c3233;--beige:#E6E1D8;--beige-d:#D5CEC3;--bronze:#B08A5A;--dark:#2B2B2B;--white:#fff;--red:#b83232;--green:#2f8f4e;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',sans-serif;background:var(--beige);color:var(--dark);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}

/* ── Encabezado ── */
.top{background:var(--teal);color:var(--beige);padding:calc(var(--sat) + 16px) calc(var(--sar) + 20px) 22px calc(var(--sal) + 20px)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:760px;margin:0 auto}
.brand{font-size:20px;font-weight:600;letter-spacing:-.4px}
.brand span{color:var(--bronze)}
.out{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;padding:8px 14px;border-radius:8px;border:1px solid rgba(230,225,216,.3);background:transparent;color:rgba(230,225,216,.85);cursor:pointer}
.hola{max-width:760px;margin:18px auto 0;font-size:14px;color:rgba(230,225,216,.75)}
.hola strong{display:block;font-size:22px;font-weight:600;color:var(--beige);letter-spacing:-.4px;margin-top:2px}

/* ── Contenido ── */
.wrap{max-width:760px;margin:0 auto;padding:18px calc(var(--sar) + 16px) calc(var(--sab) + 32px) calc(var(--sal) + 16px)}
.sec-t{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:rgba(43,43,43,.5);margin:6px 2px 10px}
.res{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:22px}
.rc{background:var(--white);border:1px solid var(--beige-d);border-radius:14px;padding:14px 16px}
.rc h3{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--teal);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.rc h3 em{font-style:normal;font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--white);background:var(--teal);border-radius:99px;padding:2px 9px}
.rc h3 em.alerta{background:var(--red)}
.rc ul{list-style:none;display:grid;gap:6px}
.rc li{font-size:13px;display:flex;justify-content:space-between;gap:10px;line-height:1.35}
.rc li small{color:rgba(43,43,43,.55);white-space:nowrap;font-size:12px}
.rc .nada{font-size:13px;color:rgba(43,43,43,.55)}
.rc .monto{font-size:20px;font-weight:600;color:var(--teal);letter-spacing:-.3px}
.rc .monto + .monto{margin-top:2px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--white);border:1px solid var(--beige-d);border-radius:16px;padding:16px 14px;display:flex;flex-direction:column;gap:10px;color:var(--dark);text-decoration:none;min-height:116px;transition:transform .12s,border-color .12s}
.card:active{transform:scale(.97);border-color:var(--teal)}
.card svg{width:30px;height:30px;stroke:var(--teal);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.card b{font-size:15px;font-weight:600;letter-spacing:-.2px;color:var(--teal);display:block}
.card small{font-size:12px;color:rgba(43,43,43,.6);line-height:1.35;display:block;margin-top:2px}
.card.ancho{grid-column:1/-1;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.chip{font-size:13px;font-weight:500;color:var(--teal);background:var(--beige);border:1px solid var(--beige-d);border-radius:99px;padding:8px 14px;text-decoration:none}
.chip:active{background:var(--teal);color:var(--beige)}
.card.gi{cursor:default;padding-bottom:14px}
.card.gi .cab{display:flex;gap:12px;align-items:center;color:inherit;text-decoration:none}

/* ── Ingreso ── */
.login{position:fixed;inset:0;background:var(--teal);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.login-box{background:var(--white);border-radius:18px;padding:34px 26px;width:100%;max-width:360px;text-align:center}
.login-box .brand{color:var(--teal);font-size:24px}
.login-box p{font-size:13px;color:rgba(43,43,43,.6);margin:6px 0 24px}
.g-btn{width:100%;padding:14px;border-radius:10px;border:1.5px solid var(--beige-d);background:var(--white);font-family:'Inter',sans-serif;font-size:14px;font-weight:500;color:var(--dark);cursor:pointer}
.g-btn:active{background:var(--beige)}
.err{font-size:12px;color:var(--red);margin-top:14px;min-height:16px;line-height:1.4}
.spin{position:fixed;inset:0;background:var(--teal);display:flex;align-items:center;justify-content:center;z-index:60}
.spin i{width:30px;height:30px;border-radius:50%;border:3px solid rgba(230,225,216,.2);border-top-color:var(--bronze);animation:g .7s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.aviso{background:rgba(184,50,50,.08);border:1px solid rgba(184,50,50,.3);color:var(--red);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.45;margin-bottom:14px}
@media(min-width:640px){.res{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<div class="spin" id="spin"><i></i></div>

<div class="login hidden" id="login">
  <div class="login-box">
    <div class="brand">Be<span>•</span>Travel</div>
    <p>Ingresá con tu cuenta de Google para ver tus herramientas.</p>
    <button class="g-btn" onclick="ingresar()">Continuar con Google</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="top-row"><div class="brand">Be<span>•</span>Travel</div><button class="out" onclick="salir()">Salir</button></div>
    <div class="hola">Hola<strong id="nombre"></strong></div>
  </header>
  <main class="wrap">
    <div class="aviso hidden" id="aviso"></div>
    <div class="sec-t">Herramientas</div>
    <div class="grid" id="botones" style="margin-bottom:24px"></div>
    <section id="resumen" class="hidden">
      <div class="sec-t">Resumen</div>
      <div class="res" id="res"></div>
    </section>
  </main>
</div>

<script src="nav.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyARJ-zVCszUxJ_Fs1UBBtMiQvjuDF98IYI",
  authDomain:"betravel-kanban.firebaseapp.com",
  databaseURL:"https://betravel-kanban-default-rtdb.firebaseio.com",
  projectId:"betravel-kanban",
  storageBucket:"betravel-kanban.firebasestorage.app",
  messagingSenderId:"644328296494",
  appId:"1:644328296494:web:aec3842de80021159f8fbf",
});
const db = firebase.database(), auth = firebase.auth();
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const emailKey = e => (e || '').toLowerCase().replace(/\./g, ',');

// ── Ingreso con Google ─────────────────────────────────────────────────────
// En una app instalada en el iPhone la ventana emergente de Google a veces no abre: si falla, se pasa a la redirección.
function ingresar(){
  $('login-err').textContent = '';
  const p = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(p).catch(err => {
    console.error(err);
    if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(err.code)){
      $('login-err').textContent = 'Abriendo el ingreso de Google en esta pantalla…';
      auth.signInWithRedirect(p).catch(e => { $('login-err').textContent = 'No se pudo iniciar sesión. Probá abrir esta página en Safari, ingresar una vez y volver a la app.'; console.error(e); });
    } else $('login-err').textContent = 'No se pudo iniciar sesión. Intentá de nuevo.';
  });
}
function salir(){ auth.signOut(); }
if (auth.getRedirectResult) auth.getRedirectResult().catch(err => { console.error(err); $('login-err').textContent = 'No se pudo completar el ingreso. Intentá de nuevo.'; });

// ── Herramientas por rol (las mismas secciones del encabezado de cada página) ──
const INFO = {
  kanban:      { sub:'Pipeline comercial', svg:'<rect x="3" y="4" width="5" height="16" rx="1.2"/><rect x="9.5" y="4" width="5" height="10" rx="1.2"/><rect x="16" y="4" width="5" height="13" rx="1.2"/>' },
  cotizador:   { sub:'Cotizaciones y propuestas', svg:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/>' },
  gestion:     { sub:'Reservas, pagos y recibos', svg:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M3 13h18"/>' },
  grupos:      { sub:'Pasajeros y habitaciones', svg:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14.2c2.6.2 4.5 2.3 4.5 4.8"/>' },
  compartidas: { sub:'Compartidas conmigo', svg:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="2.4"/>' },
  contratos:   { sub:'Contratos de grupo', svg:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 17c1.2-2.4 2.3-3.2 3-3.2.8 0 .3 2.2 1.2 2.2.7 0 1.2-1 1.8-1"/>' }
};
const ATAJOS = [['reservas', 'Reservas'], ['pasajeros', 'Pasajeros'], ['recibos', 'Recibos'], ['recordatorios', 'Recordatorios']];
let ROL = '', GRUPOS_OK = false;
function botones(){
  const secs = (AdminNav.secciones || []).filter(s => s.id !== 'inicio' && INFO[s.id] && (s.roles.indexOf(ROL) !== -1 || (s.id === 'grupos' && GRUPOS_OK)));
  $('botones').innerHTML = secs.map(s => {
    const i = INFO[s.id], ico = `<svg viewBox="0 0 24 24" aria-hidden="true">${i.svg}</svg>`;
    if (s.id === 'gestion') return `<div class="card gi ancho"><a class="cab" href="${esc(s.href)}">${ico}<div><b>${esc(s.label)}</b><small>${esc(i.sub)}</small></div></a><div class="chips">${ATAJOS.map(a => `<a class="chip" href="${esc(s.href)}#${a[0]}">${a[1]}</a>`).join('')}</div></div>`;
    return `<a class="card" href="${esc(s.href)}">${ico}<div><b>${esc(s.label)}</b><small>${esc(i.sub)}</small></div></a>`;
  }).join('');
}

// ── Resumen (solo admin y agente: leen las reservas y los recordatorios) ────
let RES = {}, REC = {};
const hoyISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const dias = f => f ? Math.round((new Date(f + 'T00:00:00') - new Date(hoyISO() + 'T00:00:00')) / 86400000) : null;
const arr = o => !o ? [] : Array.isArray(o) ? o.filter(Boolean) : Object.keys(o).map(id => ({ id, ...o[id] }));
const fmt = (n, m) => (m === 'USD' ? 'US$ ' : '$ ') + (Number(n) || 0).toLocaleString('es-AR', { maximumFractionDigits:0 });
function conv(monto, de, a, tc){
  if (!de || de === a) return monto;
  const t = Number(tc) || 0; if (t <= 0) return 0;
  return a === 'USD' && de === 'ARS' ? monto / t : a === 'ARS' && de === 'USD' ? monto * t : monto;
}
// Misma cuenta que "Saldo pendiente" de Gestión interna: valor cotizado - pagos - lo cobrado directo por ejecutivos
function saldo(r){
  const m = r.moneda || 'ARS';
  const cot = arr(r.cotizado).reduce((s, c) => s + conv(Number(c.monto) || 0, c.moneda || m, m, c.tipoCambio), 0);
  const pag = arr(r.pagos).reduce((s, p) => s + conv(Number(p.monto) || 0, p.moneda || m, m, p.tipoCambio), 0);
  const dir = arr(r.reparto).reduce((s, x) => s + conv(Number(x.montoCobradoDirecto) || 0, x.moneda || m, m, x.tipoCambio), 0);
  return cot - pag - dir;
}
function pintarResumen(){
  const rs = Object.keys(RES).map(id => ({ id, ...RES[id] })), rc = Object.keys(REC).map(id => ({ id, ...REC[id] }));
  const venc = rc.filter(x => !x.resuelto && x.tipo !== 'Tarjeta' && x.fecha && dias(x.fecha) <= 0).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const salidas = rs.filter(r => ['aceptado', 'pagado'].includes(r.estado) && r.fechaInicio && dias(r.fechaInicio) >= 0 && dias(r.fechaInicio) <= 30).sort((a, b) => a.fechaInicio.localeCompare(b.fechaInicio));
  const tot = { ARS:0, USD:0 }; let n = 0;
  rs.filter(r => r.estado === 'aceptado').forEach(r => { const s = saldo(r); if (s > 0.5){ tot[r.moneda === 'USD' ? 'USD' : 'ARS'] += s; n++; } });
  const cuando = d => d === 0 ? 'hoy' : d === 1 ? 'mañana' : `en ${d} días`;
  const lista = (items, vacio, f) => items.length ? `<ul>${items.slice(0, 3).map(f).join('')}</ul>` : `<div class="nada">${vacio}</div>`;
  $('res').innerHTML =
    `<div class="rc"><h3>Recordatorios <em class="${venc.length ? 'alerta' : ''}">${venc.length}</em></h3>${lista(venc, 'Nada vencido ni para hoy.', x => { const d = dias(x.fecha); return `<li><span>${esc(x.titulo || x.tipo || 'Recordatorio')}</span><small>${d < 0 ? 'vencido' : 'hoy'}</small></li>`; })}</div>`
    + `<div class="rc"><h3>Próximas salidas <em>${salidas.length}</em></h3>${lista(salidas, 'Sin salidas en los próximos 30 días.', r => `<li><span>${esc(r.codigo || '')} ${esc(r.cliente || '')}</span><small>${cuando(dias(r.fechaInicio))}</small></li>`)}</div>`
    + `<div class="rc"><h3>Saldo a cobrar <em>${n}</em></h3>${(tot.USD || tot.ARS) ? (tot.USD ? `<div class="monto">${fmt(tot.USD, 'USD')}</div>` : '') + (tot.ARS ? `<div class="monto">${fmt(tot.ARS, 'ARS')}</div>` : '') + `<div class="nada" style="margin-top:4px">${n} reserva${n === 1 ? '' : 's'} aceptada${n === 1 ? '' : 's'} con saldo</div>` : '<div class="nada">Sin saldos pendientes.</div>'}</div>`;
  $('resumen').classList.remove('hidden');
}
function escucharResumen(){
  db.ref('finanzas/reservas').on('value', s => { RES = s.val() || {}; pintarResumen(); }, () => {});
  db.ref('finanzas/recordatorios').on('value', s => { REC = s.val() || {}; pintarResumen(); }, () => {});
}

// ── Sesión ─────────────────────────────────────────────────────────────────
let escuchando = false;
auth.onAuthStateChanged(user => {
  $('spin').classList.add('hidden');
  if (!user){ $('app').classList.add('hidden'); $('login').classList.remove('hidden'); return; }
  $('login').classList.add('hidden');
  db.ref('finanzas/meta/usuarios/' + emailKey(user.email)).once('value').then(s => {
    $('app').classList.remove('hidden');
    $('nombre').textContent = ' ' + (((s.val() || {}).nombre) || (user.displayName || user.email).split(' ')[0]);
    if (!s.exists()){
      $('aviso').innerHTML = `La cuenta <strong>${esc(user.email)}</strong> no está habilitada para el panel interno. Pedile a un administrador que la agregue a la lista de usuarios, o salí y entrá con otra cuenta.`;
      $('aviso').classList.remove('hidden'); $('botones').innerHTML = ''; return;
    }
    const perfil = s.val() || {};
    ROL = perfil.rol || 'agente'; GRUPOS_OK = perfil.grupos === true;
    botones();
    if (ROL !== 'cotizador' && !escuchando){ escuchando = true; escucharResumen(); }
  }, () => {
    $('app').classList.remove('hidden');
    $('aviso').textContent = 'No se pudo leer tu perfil. Revisá la conexión e intentá de nuevo.'; $('aviso').classList.remove('hidden');
  });
});
</script>
</body>
</html>
