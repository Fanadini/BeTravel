<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Be•Travel Admin — Grupos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0F3D3E;--teal-h:#0c3233;--teal-l:rgba(15,61,62,.07);--teal-m:rgba(15,61,62,.14);
  --beige:#E6E1D8;--beige-d:#D5CEC3;--bronze:#B08A5A;--dark:#2B2B2B;--white:#fff;
  --board:#e8e3da;--red:#b83232;--green:#2f8f4e;--amber:#7a5a2c;
}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--board);color:var(--dark);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow:hidden}
.nav-btn{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;padding:6px 12px;border-radius:6px;border:1px solid rgba(230,225,216,.2);background:rgba(255,255,255,.08);color:rgba(230,225,216,.75);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.nav-btn:hover{background:rgba(255,255,255,.16);color:var(--beige)}
.loading-overlay{position:fixed;inset:0;background:rgba(15,61,62,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:14px}
.loading-overlay.hidden{display:none}
.spinner{width:32px;height:32px;border-radius:50%;border:3px solid rgba(230,225,216,.15);border-top-color:var(--bronze);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:12px;color:rgba(230,225,216,.5)}
.login-screen{position:fixed;inset:0;background:var(--teal);display:flex;align-items:center;justify-content:center;z-index:1100;padding:20px}
.login-screen.hidden{display:none}
.login-box{background:var(--white);border-radius:16px;padding:40px 36px;width:100%;max-width:380px;text-align:center}
.login-logo{font-size:22px;font-weight:600;color:var(--teal);letter-spacing:-.5px;margin-bottom:6px}
.login-logo span{color:var(--bronze)}
.login-subtitle{font-size:12px;color:rgba(43,43,43,.45);margin-bottom:32px}
.google-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;border-radius:9px;border:1.5px solid var(--beige-d);background:var(--white);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:var(--dark);cursor:pointer;text-decoration:none}
.google-btn:hover{border-color:rgba(15,61,62,.3);background:var(--beige)}
.login-error{font-size:11px;color:var(--red);margin-top:14px;min-height:16px}

.main{flex:1;min-height:0;display:flex;flex-direction:column}
.banner{display:none;background:rgba(184,50,50,.1);border:1px solid rgba(184,50,50,.3);color:var(--red);font-size:12px;line-height:1.5;padding:10px 14px;margin:12px 18px 0;border-radius:8px}
.banner.show{display:block}
.btn{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;padding:8px 14px;border-radius:7px;border:1.5px solid var(--teal);background:var(--teal);color:var(--beige);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--teal-h)}
.btn.outline{background:transparent;color:var(--teal)}
.btn.outline:hover{background:var(--teal-l)}
.btn.small{padding:5px 10px;font-size:11px}
.btn.danger{border-color:var(--red);color:var(--red);background:transparent}
.hidden{display:none!important}
.scroll{flex:1;overflow-y:auto;padding:18px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.section-head h2{font-size:15px;font-weight:600;color:var(--teal)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.lista{background:var(--white);border:1px solid var(--beige-d);border-radius:10px;overflow:auto}
.lista table{width:100%;border-collapse:collapse;font-size:12px}
.lista th{text-align:left;font-weight:600;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:rgba(43,43,43,.55);padding:9px 12px;border-bottom:1px solid var(--beige-d);white-space:nowrap}
.lista td{padding:9px 12px;border-bottom:1px solid rgba(213,206,195,.5);vertical-align:middle}
.num{text-align:right !important}
.lista tr.fila{cursor:pointer}
.lista tr.fila:hover{background:var(--teal-l)}
.vacio{padding:30px;text-align:center;font-size:12px;color:rgba(43,43,43,.5)}
.pill{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--teal-l);color:var(--teal);white-space:nowrap}
.pill.ok{background:rgba(47,143,78,.12);color:var(--green)}
.pill.warn{background:rgba(176,138,90,.2);color:var(--amber)}
.pill.bad{background:rgba(184,50,50,.12);color:var(--red)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 18px;background:var(--white);border-bottom:1px solid var(--beige-d)}
.toolbar .grow{flex:1}
.gtitle{font-size:14px;font-weight:600;color:var(--teal)}
.tabs{display:flex;gap:6px;padding:10px 18px 0;flex-wrap:wrap}
.tab{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;padding:7px 14px;border-radius:7px 7px 0 0;border:1px solid var(--beige-d);border-bottom:none;background:rgba(255,255,255,.5);cursor:pointer;color:rgba(43,43,43,.7)}
.tab.on{background:var(--white);color:var(--teal);font-weight:600}
.card{background:var(--white);border:1px solid var(--beige-d);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.card h3{font-size:13px;font-weight:600;color:var(--teal);margin-bottom:8px}
.hint{font-size:11px;line-height:1.5;color:rgba(43,43,43,.6);margin-bottom:8px}
.linkbox{display:flex;gap:8px;flex-wrap:wrap}
.linkbox input{flex:1;min-width:220px}
input[type=text],input[type=date],input[type=number],select,textarea{font-family:'Inter',sans-serif;font-size:12px;padding:7px 9px;border-radius:7px;border:1.5px solid var(--beige-d);background:var(--white);outline:none;color:var(--dark)}
input:focus,select:focus,textarea:focus{border-color:var(--teal)}
textarea{width:100%;min-height:140px;resize:vertical;line-height:1.5}
.hab{background:var(--white);border:1px solid var(--beige-d);border-radius:10px;margin-bottom:10px;overflow:hidden}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;align-items:start}
.res-grid .card{margin:0}
.hab-h{cursor:grab;color:rgba(43,43,43,.4);font-size:13px;letter-spacing:-3px;user-select:none;padding:0 4px}
.hab-h:hover{color:var(--teal)}
.hab-num{width:58px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--teal);padding:3px 6px;border:1.5px solid var(--beige-d);border-radius:6px;background:var(--white)}
.dnd-ghost{opacity:.4}
.dnd-before{box-shadow:0 -3px 0 0 var(--teal)}
.dnd-after{box-shadow:0 3px 0 0 var(--teal)}
.hab-head{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--teal-l);font-size:12px;font-weight:600;color:var(--teal);flex-wrap:wrap}
.hab-head .grow{flex:1}
.hab-body{padding:6px 14px 10px}
.ocu{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(213,206,195,.5);font-size:12px;flex-wrap:wrap}
.ocu:last-child{border-bottom:none}
.ocu .nom{flex:1;min-width:160px}
.ocu .sub{font-size:10.5px;color:rgba(43,43,43,.55)}
.alertas{padding:0 14px 10px;font-size:11px;color:var(--amber);line-height:1.5}
.alertas.red{color:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(15,61,62,.55);z-index:900;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--white);border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;padding:20px}
.modal h3{font-size:15px;color:var(--teal);margin-bottom:12px}
.det{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:12px;margin-bottom:14px}
.det dt{color:rgba(43,43,43,.55)}
.det dd{white-space:pre-wrap;word-break:break-word}

.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.filtros input{flex:1;min-width:220px}
.filtros input[type=number],.filtros input[type=date]{flex:0 1 auto;min-width:0}
.lnk{cursor:pointer}
.lnk:hover{color:var(--teal);text-decoration:underline}
.chev{display:inline-block;width:14px;color:rgba(15,61,62,.6)}
.hab-res{font-weight:400;color:rgba(43,43,43,.65);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:48ch}
.ocu .sub,.lista td .sub{font-size:10.5px;color:rgba(43,43,43,.55)}
.fq{border:1px solid var(--beige-d);border-radius:10px;background:var(--white);margin-bottom:8px}
.fq.sec{background:var(--teal-l);border-color:var(--teal-m)}
.fq-row{display:flex;align-items:center;gap:10px;padding:8px 10px}
.fq-h{cursor:grab;color:rgba(43,43,43,.4);font-size:14px;letter-spacing:-2px;user-select:none}
.fq-t{flex:1;min-width:0;cursor:pointer;font-size:12px}
.fq-s{font-size:10.5px;color:rgba(43,43,43,.55);margin-top:1px}
.fq-edit{padding:4px 14px 14px;border-top:1px solid var(--beige-d)}
.fq-f{display:flex;flex-direction:column;gap:3px;margin-top:10px;min-width:0;flex:1}
.fq-f label{font-size:10.5px;font-weight:500;color:rgba(43,43,43,.65)}
.fq-f input,.fq-f select,.fq-f textarea{width:100%;font-size:12px}
.fq-f textarea{min-height:70px}
.fq-g{display:flex;gap:10px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:7px;font-size:12px;padding:4px 0}
/* selector de pasajeros que cubre un pago: lista desplegable, con buscador y desplazamiento propio */
.pax-pick{border:1.5px solid var(--beige-d);border-radius:8px;background:var(--white);padding:0;overflow:hidden}
.pax-pick summary{cursor:pointer;padding:8px 10px;font-size:12px;color:var(--dark,#2B2B2B);list-style:none}
.pax-pick summary::-webkit-details-marker{display:none}
.pax-pick summary::after{content:'▾';float:right;color:rgba(43,43,43,.45)}
.pax-pick[open] summary{border-bottom:1px solid var(--beige-d)}
.pax-pick .pax-filter{margin:8px;width:calc(100% - 16px);padding:6px 9px;font-size:12px}
.pax-pick .share-list{display:grid;grid-template-columns:1fr;gap:4px;margin:0 8px 8px;max-height:220px;overflow-y:auto}
.pax-pick .share-list label{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;padding:5px 8px;border:1px solid var(--beige-d);border-radius:6px;min-width:0}
.pax-pick .share-list label:hover{background:var(--teal-l)}
.pax-pick .share-list input{flex:none}
.opts-chk{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:4px}
.btn:disabled{opacity:.4;cursor:default}

/* ── IMPRESIÓN (PDF) ── */
#print-area{display:none}
@page{size:A4 landscape;margin:12mm}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;display:block!important}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important;font-family:'Inter',sans-serif;color:#000;font-size:9pt}
  #print-area h1{font-size:13pt;font-weight:600;margin-bottom:1mm}
  #print-area .sub{font-size:8.5pt;color:#444;margin-bottom:4mm}
  #print-area table{width:100%;border-collapse:collapse}
  #print-area th{text-align:left;font-size:7.5pt;text-transform:uppercase;letter-spacing:.4pt;border-bottom:1.2px solid #000;padding:1.5mm 2mm}
  #print-area td{padding:1.6mm 2mm;border-bottom:.5px solid #999;vertical-align:top}
  #print-area tr{break-inside:avoid;page-break-inside:avoid}
  #print-area td.g{border-top:1px solid #000;font-weight:600}
}
@media(max-width:700px){.nav-user{display:none}.scroll{padding:12px}.det{grid-template-columns:1fr}}
</style>

<body>

  </div>
</div>

  <div class="login-box">
    <div class="login-logo">Be<span>•</span>Travel</div>
    <div class="login-subtitle">Acceso restringido</div>
    <p style="font-size:13px;line-height:1.55;color:#2B2B2B;margin-bottom:22px" id="noacceso-msg"></p>
    <a class="google-btn" href="cotizador.html" style="margin-bottom:10px">Ir al Cotizador</a>
    <button class="google-btn" onclick="logout()">Salir y usar otra cuenta</button>
  </div>
</div>
<div class="loading-overlay" id="lo"><div class="spinner"></div><div class="loading-text">Conectando con Firebase…</div></div>

<script src="nav.js"></script>
<script src="ordenar.js"></script>
<script>AdminNav.mount({ pagina:'grupos' });</script>

<div class="main">
  <div class="banner" id="banner"></div>

  <!-- LISTA DE GRUPOS -->
  <div class="scroll" id="view-list">
    <div class="section-head">
      <h2>Grupos</h2>
      <button class="btn" onclick="nuevoGrupo()">+ Nuevo grupo</button>
    </div>
    <div class="lista" id="lista-grupos"></div>
  </div>

  <!-- DETALLE DE GRUPO -->
  <div class="hidden" id="view-group" style="flex:1;min-height:0;display:flex;flex-direction:column">
    <div class="toolbar">
      <button class="btn outline small" onclick="volverLista()">← Grupos</button>
      <span class="gtitle" id="g-titulo"></span>
      <span class="pill" id="g-estado"></span>
      <span class="grow"></span>
      <button class="btn outline small" onclick="exportarExcel()">Excel</button>
      <button class="btn outline small" onclick="imprimir('rooming')">PDF rooming list</button>
      <button class="btn outline small" onclick="imprimir('lista')">PDF pasajeros</button>

      <button class="tab" data-t="cfg" onclick="setTab('cfg')">Ajustes</button>

  </div>

<div id="print-area"></div>
<div id="modal-root"></div>

<script src="../form-default.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
// ── FIREBASE ───────────────────────────────────────────────────────────────
firebase.initializeApp({
  apiKey:"AIzaSyARJ-zVCszUxJ_Fs1UBBtMiQvjuDF98IYI",
  authDomain:"betravel-kanban.firebaseapp.com",
  databaseURL:"https://betravel-kanban-default-rtdb.firebaseio.com",
  projectId:"betravel-kanban",
  storageBucket:"betravel-kanban.firebasestorage.app",
  messagingSenderId:"644328296494",
  appId:"1:644328296494:web:aec3842de80021159f8fbf",
});
const db = firebase.database();
const auth = firebase.auth();
const GRUPOS_REF = db.ref('grupos');
const META_USUARIOS_REF = db.ref('finanzas/meta/usuarios');

// ── AUTH (admin y agente; el cotizador no entra) ───────────────────────────
let CURRENT_USER = { email:'', nombre:'', rol:'' };
function emailKey(email){ return (email||'').toLowerCase().replace(/\./g, ','); }
function loginWithGoogle(){
  const provider = new firebase.auth.GoogleAuthProvider();
  document.getElementById('login-error').textContent = '';
  auth.signInWithPopup(provider).catch(err => {
    document.getElementById('login-error').textContent = 'Error al iniciar sesión. Intentá de nuevo.';
    console.error(err);
  });
}
function logout(){ auth.signOut(); }
function verificarAcceso(email){
  return META_USUARIOS_REF.child(emailKey(email)).once('value').then(s => {
    if (s.exists()) return { perfil: s.val() || {}, sinConfigurar: false };
    return META_USUARIOS_REF.once('value').then(all => Object.keys(all.val() || {}).length ? null : { perfil: {}, sinConfigurar: true }, () => null);
  }, () => null);
}
function mostrarSinAcceso(email, esCotizador){
  document.getElementById('noacceso-msg').innerHTML = esCotizador
    ? `La cuenta <strong>${esc(email)}</strong> tiene rol de cotizador y no accede a los datos de pasajeros.`
    : `La cuenta <strong>${esc(email)}</strong> no está habilitada para el panel interno. Pedile a un administrador que la agregue a la lista de usuarios.`;
  document.getElementById('noacceso-screen').classList.remove('hidden');
  document.getElementById('lo').classList.add('hidden');
}
let listenersAttached = false;
auth.onAuthStateChanged(user => {
  const loginScreen = document.getElementById('login-screen');
  if (!user){
    document.getElementById('noacceso-screen').classList.add('hidden');
    loginScreen.classList.remove('hidden');
    document.getElementById('lo').classList.add('hidden');
    return;
  }
  loginScreen.classList.add('hidden');
  const nombreGoogle = user.displayName ? user.displayName.split(' ')[0] : user.email;
  document.getElementById('nav-user-name').textContent = nombreGoogle;
  CURRENT_USER = { email:user.email, nombre: user.displayName || nombreGoogle, rol:'' };
  verificarAcceso(user.email).then(acc => {
    if (!acc){ mostrarSinAcceso(user.email); return; }
    CURRENT_USER.rol = acc.sinConfigurar || acc.perfil.rol === 'admin' ? 'admin' : (acc.perfil.rol || 'agente');
    CURRENT_USER.grupos = acc.perfil.grupos === true;   // marca que habilita Grupos a un cotizador
    if (CURRENT_USER.rol === 'cotizador' && !CURRENT_USER.grupos){ mostrarSinAcceso(user.email, true); return; }
    AdminNav.setUser({ rol: CURRENT_USER.rol, nombre: CURRENT_USER.nombre, grupos: CURRENT_USER.grupos });
    if (!listenersAttached){ attachListeners(); listenersAttached = true; }
  });
});
function showBanner(msg){ const b = document.getElementById('banner'); b.textContent = msg; b.classList.toggle('show', !!msg); }
function handleWriteError(err){
  console.error(err);
  if (String(err && (err.code||err.message)).toUpperCase().includes('PERMISSION')){
    showBanner('Firebase rechazó la operación: falta publicar las reglas actualizadas (database.rules.json) o tu cuenta no está habilitada. Ver admin/SEGURIDAD_FIREBASE.md.');
  } else showBanner('No se pudo guardar. Revisá la conexión e intentá de nuevo.');
}

// ── UTILIDADES ─────────────────────────────────────────────────────────────
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
function fmtFecha(iso){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? `${m[3]}/${m[2]}/${m[1]}` : (iso || ''); }
const CAPACIDAD = { 'Single':1, 'Doble':2, 'Triple':3, 'Cuádruple':4 };
const TIPOS = Object.keys(CAPACIDAD);
// Los infantes (INF) no ocupan lugar en la habitación: el hotel cuenta, por ejemplo, "doble + bebé"
function esInf(rid){ const g = GRUPOS[GID_ABIERTO]; if (!g || !g.respuestas || !g.respuestas[rid]) return false; return tipoPax(g, rid, g.respuestas[rid], refViaje(g)).t === 'INF'; }
const adultos = ids => ids.filter(x => !esInf(x)).length;
function tipoPorTamano(n){ return n <= 1 ? 'Single' : n === 2 ? 'Doble' : n === 3 ? 'Triple' : 'Cuádruple'; }
function nuevoToken(){
  const a = new Uint8Array(16); crypto.getRandomValues(a);
  return Array.from(a, b => b.toString(36).padStart(2, '0')).join('').slice(0, 22);
}
function linkPublico(gid){ return new URL('../pasajeros.html?g=' + gid, location.href).href; }

// ── ESTADO ─────────────────────────────────────────────────────────────────
let GRUPOS = {};          // { gid: { meta, respuestas:{rid:{}}, habitaciones:{hid:{}} } }
let GID_ABIERTO = null;
let TAB = 'res';

function attachListeners(){
  GRUPOS_REF.on('value', snap => {
    GRUPOS = snap.val() || {}; GRUPOS_CARGADOS = true;
    document.getElementById('lo').classList.add('hidden');
    showBanner('');
    render(); sincronizarIndice(); programarSyncResumen();
  }, err => { document.getElementById('lo').classList.add('hidden'); handleWriteError(err); });
  IDX_REF.on('value', snap => { IDX = snap.val() || {}; sincronizarIndice(); }, () => {});
  escucharReservas();

function ocupacion(h, ids){
  const cap = CAPACIDAD[h.tipo] || 0, n = adultos(ids), vacia = ids.length === 0;
  if (cap < 2) return { faltan: !vacia && !n ? cap : 0, sobran: n > cap && cap ? n - cap : 0, vacia };
  return { faltan: !vacia && n < cap ? cap - n : 0, sobran: n > cap ? n - cap : 0, vacia };
}
function pillOcupacion(h, ids){
  const o = ocupacion(h, ids), plural = x => x === 1 ? 'persona' : 'personas';
  if (o.vacia) return '<span class="pill warn" title="Habitación sin pasajeros">Vacía</span>';
  if (o.faltan) return `<span class="pill bad" title="Habitación ${esc(h.tipo)}: tiene ${adultos(ids)} de ${CAPACIDAD[h.tipo]} personas (sin contar infantes)">Falta ${o.faltan} ${plural(o.faltan)}</span>`;
  if (o.sobran) return `<span class="pill bad" title="Habitación ${esc(h.tipo)}: supera su capacidad">Sobra${o.sobran === 1 ? '' : 'n'} ${o.sobran} ${plural(o.sobran)}</span>`;

}

const TIPOS_Q = { corto:'Texto corto', largo:'Texto largo', fecha:'Fecha', email:'Correo electrónico', tel:'Teléfono', numero:'Número', radio:'Opción única', lista:'Desplegable', multiple:'Selección múltiple', casilla:'Casilla de verificación', companero:'Buscador de pasajeros', texto:'Texto informativo', seccion:'Sección (título)' };

function listaForm(meta){
  const f = meta && meta.form;

function limpiarForm(arr){   // Firebase no acepta undefined ni vacíos
  return clonar(arr).map(q => {
    ['ayuda', 'etiqueta'].forEach(k => { if (q[k] != null) q[k] = String(q[k]).trim(); });
    Object.keys(q).forEach(k => { if (q[k] === undefined || q[k] === '' && k !== 'etiqueta' || (Array.isArray(q[k]) && !q[k].length) || q[k] === false) delete q[k]; });
    if (!CON_OPCIONES.includes(q.tipo)) delete q.opciones;
    if (q.mostrarSi && (!q.mostrarSi.id || !(q.mostrarSi.valores || []).length)) delete q.mostrarSi;

}

function fCond(i, id){ if (!id) delete DRAFT[i].mostrarSi; else DRAFT[i].mostrarSi = { id, valores:[] }; marcar(); redibujarForm(); }

  const pax = respuestasOrdenadas(g).map(([rid, r]) => [tipoPax(g, rid, r, refX).t, ...cols.map(c => valorTxt(r, c)), asg[rid] ? asg[rid].n : '', asg[rid] ? asg[rid].h.tipo : '', asg[rid] ? camaHab(asg[rid].h, resps) : '', ...(conPagos ? [pp[rid] ? totTxt(pp[rid].tot) : 'Sin pagos'] : []), ...(qPagoX.length ? [eleccionPago(r, qPagoX).join(', ')] : []), ...(conCobrosX ? (c => veSaldo() ? [c.aereo, c.hotel, c.ajuste, c.total, c.pagado, c.saldo] : [c.aereo, c.hotel, c.ajuste, c.total])(cobroDe(g, rid, r, refX, asgX, pp)) : []), notaPax(g, rid)]);
  const refE = refViaje(g);
  const hab = filasHabitaciones(g).map(f => [f.n, f.tipo, f.cama, f.r.apellido, f.r.nombre, tipoPax(g, f.rid, f.r, refE).t, f.r.pasaporte, fmtFecha(f.r.vencimiento), f.r.restricciones || '', f.r.movilidad || '', f.hnota || '', notaPax(g, f.rid)]);
  const blob = armarXlsx([
    { nombre:'Pasajeros', cabecera: ['Tipo (ADT/CHD/INF)', ...cols.map(c => c.etiqueta), 'Habitación asignada', 'Tipo de habitación asignada', 'Cama de la habitación', ...(conPagos ? ['Pagos'] : []), ...(qPagoX.length ? ['Medio de pago elegido'] : []), ...(conCobrosX ? (veSaldo() ? ['Aéreo', 'Hotel', 'Ajuste', 'A pagar', 'Pagó', 'Saldo'] : ['Aéreo', 'Hotel', 'Ajuste', 'A pagar']) : []), 'Comentarios'], filas: pax },
    { nombre:'Habitaciones', cabecera:['Habitación','Tipo','Cama','Apellido','Nombre','ADT/CHD/INF','Pasaporte','Vencimiento','Restricciones alimentarias','Movilidad / asistencia','Comentarios de la habitación','Comentarios del pasajero'], filas: hab },
  ]);
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = (g.meta.nombre || 'grupo').replace(/[^\w\-]+/g, '_') + '.xlsx';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ── EXPORTAR: PDF (impresión del navegador) ────────────────────────────────
function imprimir(tipo){
  const g = GRUPOS[GID_ABIERTO], resps = g.respuestas || {};
  let html = `<h1>${esc(g.meta.nombre)}</h1><div class="sub">${tipo === 'plan' ? 'Plan de pagos' : tipo === 'rooming' ? 'Rooming list' : 'Listado de pasajeros'} · ${new Date().toLocaleDateString('es-AR')}</div>`;
  if (tipo === 'plan'){ document.getElementById('print-area').innerHTML = html.replace('Plan de pagos', 'Plan de pagos' + (PLAN_VISTA === 'hab' ? ' por habitación' : '')) + (PLAN_CUB ? `<div class="sub">${PLAN_CUB === 'si' ? 'Solo pasajeros cubiertos por los novios' : 'Solo pasajeros que no cubren los novios'}</div>` : '') + (PLAN_MEDIO ? `<div class="sub">Filtrado por medio de pago: ${esc(PLAN_MEDIO.slice(2))}</div>` : '') + htmlPlanTabla(g); window.print(); return; }
  if (tipo === 'rooming'){
    const refR2 = refViaje(g);
    html += '<table><thead><tr><th>Hab.</th><th>Tipo</th><th>Cama</th><th>Pasajero</th><th>Pasaporte</th><th>Vence</th><th>Observaciones</th></tr></thead><tbody>';
    filasHabitaciones(g).forEach(f => {
      const obs = [f.r.restricciones, f.r.movilidad].filter(x => x && !/^ninguna?\.?$/i.test(x.trim())).join(' · ');
      html += `<tr><td class="${f.primero ? 'g' : ''}">${f.primero ? f.n : ''}</td><td class="${f.primero ? 'g' : ''}">${f.primero ? esc(f.tipo) : ''}</td><td class="${f.primero ? 'g' : ''}">${f.primero ? esc(f.cama) : ''}</td><td class="${f.primero ? 'g' : ''}">${esc(f.r.apellido)}, ${esc(f.r.nombre)}${tipoPax(g, f.rid, f.r, refR2).t ? ' (' + tipoPax(g, f.rid, f.r, refR2).t + ')' : ''}</td><td class="${f.primero ? 'g' : ''}">${esc(f.r.pasaporte)}</td><td class="${f.primero ? 'g' : ''}">${fmtFecha(f.r.vencimiento)}</td><td class="${f.primero ? 'g' : ''}">${esc(obs)}</td></tr>`;
    });
  } else {
    html += '<table><thead><tr><th>Pasajero</th><th>Tipo</th><th>Nacimiento</th><th>Nacionalidad</th><th>Pasaporte</th><th>Emisión</th><th>Vence</th><th>Contacto</th><th>Notas</th></tr></thead><tbody>';
    const refP = refViaje(g);
    respuestasOrdenadas(g).forEach(([rid0, r]) => {
      const notas = [r.restricciones && !/^ninguna?\.?$/i.test(r.restricciones.trim()) ? 'Alim.: ' + r.restricciones : '', r.movilidad && !/^ninguna?\.?$/i.test(r.movilidad.trim()) ? 'Mov.: ' + r.movilidad : '', r.medicas ? 'Méd.: ' + r.medicas : ''].filter(Boolean).join(' · ');
      html += `<tr><td><strong>${esc(r.apellido)}, ${esc(r.nombre)}</strong></td><td>${esc(tipoPax(g, rid0, r, refP).t || '—')}</td><td>${fmtFecha(r.nacimiento)}</td><td>${esc(r.nacionalidad)}</td><td>${esc(r.pasaporte)}<br>${esc(r.paisPasaporte)}</td><td>${fmtFecha(r.emision)}</td><td>${fmtFecha(r.vencimiento)}</td><td>${esc(r.email)}<br>${esc(r.telefono)}</td><td>${esc(notas)}</td></tr>`;
    });
  }
  html += '</tbody></table>';
  document.getElementById('print-area').innerHTML = html;
  window.print();
}
