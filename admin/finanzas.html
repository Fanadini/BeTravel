<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be•Travel — Finanzas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0F3D3E;--teal-h:#0c3233;--teal-l:rgba(15,61,62,.07);--teal-m:rgba(15,61,62,.14);
  --beige:#E6E1D8;--beige-d:#D5CEC3;--bronze:#B08A5A;--dark:#2B2B2B;--white:#fff;
  --board:#e8e3da;--red:#b83232;--amber:#c97a1a;--green:#2f8f4e;
  --shadow-s:0 1px 3px rgba(0,0,0,.10),0 1px 2px rgba(0,0,0,.06);
  --shadow-m:0 4px 12px rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.08);
  --shadow-l:0 10px 30px rgba(0,0,0,.16),0 4px 8px rgba(0,0,0,.08);
}
body{font-family:'Inter',sans-serif;background:var(--board);color:var(--dark);height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow:hidden}

/* ── NAV ── */
.nav{background:var(--teal);height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:300;box-shadow:0 2px 8px rgba(0,0,0,.2);gap:10px;flex-shrink:0}
.nav-left{display:flex;align-items:center;gap:12px;flex-shrink:0}
.nav-brand{font-size:15px;font-weight:600;color:var(--beige);letter-spacing:-.3px;white-space:nowrap}
.nav-brand span{color:var(--bronze)}
.nav-right{display:flex;align-items:center;gap:7px;flex-shrink:0}
.sync-pill{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;background:rgba(0,0,0,.2);font-size:10px;color:rgba(230,225,216,.55)}
.sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:background .4s}
.sync-dot.ok{background:#4ade80;box-shadow:0 0 6px #4ade8088}
.sync-dot.err{background:#f87171}
.sync-dot.loading{background:var(--bronze);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.nav-btn{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;padding:6px 12px;border-radius:6px;border:1px solid rgba(230,225,216,.2);background:rgba(255,255,255,.08);color:rgba(230,225,216,.75);cursor:pointer;transition:all .18s;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center}
.nav-btn:hover{background:rgba(255,255,255,.16);color:var(--beige);border-color:rgba(230,225,216,.4)}
.nav-user{font-size:11px;color:rgba(230,225,216,.6);white-space:nowrap}

/* ── TABS ── */
.tabs{background:rgba(15,61,62,.95);height:42px;display:flex;align-items:center;padding:0 16px;gap:4px;flex-shrink:0;overflow-x:auto}
.tab-btn{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;padding:8px 14px;border-radius:7px 7px 0 0;border:none;background:transparent;color:rgba(230,225,216,.55);cursor:pointer;transition:all .15s;white-space:nowrap}
.tab-btn:hover{color:var(--beige);background:rgba(255,255,255,.06)}
.tab-btn.on{background:var(--board);color:var(--teal);font-weight:600}

/* ── LOADING / LOGIN (idéntico a kanban.html) ── */
.loading-overlay{position:fixed;inset:0;background:rgba(15,61,62,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:14px}
.loading-overlay.hidden{display:none}
.spinner{width:32px;height:32px;border-radius:50%;border:3px solid rgba(230,225,216,.15);border-top-color:var(--bronze);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:12px;color:rgba(230,225,216,.5)}
.login-screen{position:fixed;inset:0;background:var(--teal);display:flex;align-items:center;justify-content:center;z-index:1100;padding:20px}
.login-screen.hidden{display:none}
.login-box{background:var(--white);border-radius:16px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
.login-logo{font-size:22px;font-weight:600;color:var(--teal);letter-spacing:-.5px;margin-bottom:6px}
.login-logo span{color:var(--bronze)}
.login-subtitle{font-size:12px;color:rgba(43,43,43,.45);margin-bottom:32px}
.google-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;border-radius:9px;border:1.5px solid var(--beige-d);background:var(--white);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:var(--dark);cursor:pointer;transition:all .18s;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.google-btn:hover{border-color:rgba(15,61,62,.3);background:var(--beige);box-shadow:0 3px 8px rgba(0,0,0,.1)}
.login-error{font-size:11px;color:var(--red);margin-top:14px;min-height:16px}

/* ── MAIN ── */
.main{flex:1;overflow-y:auto;padding:18px}

/* Resumen */
.cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.stat-card{background:var(--white);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow-s)}
.stat-card h4{font-size:11px;font-weight:600;color:rgba(43,43,43,.5);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.stat-amounts{display:flex;flex-direction:column;gap:2px}
.stat-amount{font-size:20px;font-weight:600;color:var(--teal);line-height:1.3}
.stat-amount.empty{font-size:13px;font-weight:500;color:rgba(43,43,43,.3)}
.stat-card.alert h4{color:var(--red)}
.stat-card.alert .stat-amount{color:var(--red)}

.alerts-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.alerts-wrap{grid-template-columns:1fr}}
.alert-col{background:var(--white);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow-s)}
.alert-col h3{font-size:12px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.alert-col h3 .chevron{margin-left:auto;font-size:10px;opacity:.5;transition:transform .15s}
.alert-col.collapsed h3 .chevron{transform:rotate(-90deg)}
.alert-col.collapsed #list-vencidos,.alert-col.collapsed #list-proximos{display:none}
.alert-count{font-size:10.5px;font-weight:600;opacity:.6}
.alert-col.vencidos h3{color:var(--red)}
.alert-col.proximos h3{color:var(--amber)}
.alert-dot{width:8px;height:8px;border-radius:50%}
.alert-col.vencidos .alert-dot{background:var(--red)}
.alert-col.proximos .alert-dot{background:var(--amber)}
.alert-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 6px;border-radius:6px;cursor:pointer;transition:background .12s;font-size:12px}
.alert-row:hover{background:var(--beige)}
.alert-row+.alert-row{border-top:1px solid rgba(0,0,0,.05)}
.alert-title{font-weight:500;color:var(--dark)}
.alert-sub{font-size:10.5px;color:rgba(43,43,43,.45);margin-top:1px}
.alert-meta{text-align:right;flex-shrink:0}
.alert-days{font-size:10px;font-weight:600}
.alert-col.vencidos .alert-days{color:var(--red)}
.alert-col.proximos .alert-days{color:var(--amber)}
.alert-amount{font-size:11.5px;font-weight:600;color:var(--dark)}
.empty-msg{font-size:11.5px;color:rgba(43,43,43,.35);padding:10px 6px}

/* Tabla genérica */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-head h2{font-size:15px;font-weight:600;color:var(--teal)}
.new-btn{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;padding:8px 14px;border-radius:7px;border:none;background:var(--bronze);color:#fff;cursor:pointer;transition:background .15s;display:inline-flex;align-items:center;gap:6px}
.new-btn:hover{background:#9a7648}
.new-btn.outline{background:transparent;color:var(--teal);border:1.5px solid var(--teal);box-shadow:none}
.new-btn.outline:hover{background:var(--teal-l)}
.table-wrap{overflow-x:auto;border-radius:10px;box-shadow:var(--shadow-s)}
.data-table{width:100%;border-collapse:collapse;background:var(--white);border-radius:10px;overflow:hidden}
.table-wrap .data-table{box-shadow:none}
.data-table th{padding:10px 14px;text-align:left;font-size:10px;font-weight:600;color:rgba(43,43,43,.45);letter-spacing:1px;text-transform:uppercase;background:var(--beige);border-bottom:1px solid var(--beige-d);white-space:nowrap}
.data-table td{padding:11px 14px;font-size:12.5px;border-bottom:1px solid rgba(0,0,0,.05);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tbody tr:hover td{background:rgba(15,61,62,.03);cursor:pointer}
.data-table th.sortable-th{cursor:pointer;user-select:none}
.data-table th.sortable-th:hover{color:var(--teal)}
.data-table th.sortable-th.active{color:var(--teal)}
.data-table tr.filter-row th{background:var(--white);padding:6px 10px;border-bottom:1px solid var(--beige-d)}
.col-filter{width:100%;font-family:'Inter',sans-serif;font-size:11px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--dark);background:var(--beige);border:1px solid var(--beige-d);border-radius:5px;padding:5px 7px;outline:none}
.col-filter:focus{border-color:var(--teal);background:var(--white)}
.badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;display:inline-block}
.badge.vencido{background:rgba(184,50,50,.12);color:var(--red)}
.badge.proximo{background:rgba(201,122,26,.14);color:var(--amber)}
.badge.ok{background:rgba(15,61,62,.08);color:var(--teal)}
.badge.done{background:rgba(47,143,78,.13);color:var(--green)}
.badge.estado-cotizada{background:rgba(43,43,43,.08);color:rgba(43,43,43,.6)}
.badge.estado-confirmada{background:rgba(15,61,62,.14);color:var(--teal)}
.badge.estado-pagada{background:rgba(47,143,78,.13);color:var(--green)}
.badge.estado-cerrada{background:rgba(47,143,78,.13);color:var(--green)}
.badge.estado-cancelada{background:rgba(184,50,50,.12);color:var(--red)}
.badge.fact-facturada{background:rgba(47,143,78,.13);color:var(--green)}
.badge.fact-pendiente{background:rgba(43,43,43,.08);color:rgba(43,43,43,.6)}
.money{font-weight:600;white-space:nowrap}
.money.usd{color:var(--bronze)}
.table-empty{padding:40px 20px;text-align:center;color:rgba(43,43,43,.35);font-size:12.5px}

/* ── FORM (modal simple) ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--white);border-radius:14px;padding:28px;width:100%;max-width:460px;box-shadow:var(--shadow-l);transform:translateY(10px);transition:transform .2s;max-height:90vh;overflow-y:auto;position:relative}
.modal-overlay.open .modal{transform:translateY(0)}
.modal h3{font-size:16px;font-weight:600;color:var(--teal);margin-bottom:18px}
.fl{display:block;font-size:11px;font-weight:500;color:rgba(43,43,43,.5);margin-bottom:5px}
.fi,.fsel{width:100%;font-family:'Inter',sans-serif;font-size:13px;color:var(--dark);background:var(--beige);border:1.5px solid var(--beige-d);border-radius:8px;padding:9px 12px;outline:none;transition:border-color .15s,background .15s}
.fi:focus,.fsel:focus,.fta:focus{border-color:var(--teal);background:var(--white)}
.fta{width:100%;font-family:'Inter',sans-serif;font-size:13px;color:var(--dark);background:var(--beige);border:1.5px solid var(--beige-d);border-radius:8px;padding:9px 12px;outline:none;resize:none;min-height:70px;line-height:1.6}
.frow{margin-bottom:14px}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.frow3{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-bottom:14px}
.save-btn{width:100%;padding:11px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.4px;background:var(--teal);color:var(--beige);border:none;border-radius:8px;cursor:pointer;box-shadow:0 2px 8px rgba(15,61,62,.2);margin-top:4px}
.save-btn:hover{background:var(--teal-h)}
.delete-btn{width:100%;padding:9px;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;background:transparent;color:rgba(184,50,50,.7);border:1.5px solid rgba(184,50,50,.25);border-radius:8px;cursor:pointer;margin-top:8px}
.delete-btn:hover{background:rgba(184,50,50,.06)}
.modal-close-x{position:absolute;top:18px;right:18px;width:26px;height:26px;border-radius:6px;border:none;background:transparent;cursor:pointer;font-size:15px;color:rgba(43,43,43,.4)}
.modal-close-x:hover{background:var(--beige)}
.check-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.check-row input{width:16px;height:16px;accent-color:var(--teal)}
.check-row label{font-size:12.5px;color:var(--dark)}

/* ── PANEL (reserva: carpeta completa) ── */
.panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:700;opacity:0;pointer-events:none;transition:opacity .22s}
.panel-overlay.open{opacity:1;pointer-events:all}
.panel{position:fixed;top:0;right:-480px;bottom:0;width:460px;max-width:92vw;background:var(--white);z-index:800;box-shadow:-4px 0 24px rgba(0,0,0,.15);transition:right .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden}
.panel.open{right:0}
.panel-header{background:var(--teal);padding:16px 20px;flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.panel-header h3{font-size:15px;font-weight:600;color:var(--beige)}
.panel-close{width:28px;height:28px;border-radius:6px;border:1px solid rgba(230,225,216,.2);background:transparent;cursor:pointer;font-size:15px;color:rgba(230,225,216,.7);flex-shrink:0}
.panel-close:hover{background:rgba(255,255,255,.12);color:var(--beige)}
.panel-body{flex:1;overflow-y:auto;padding:20px}
.panel-body::-webkit-scrollbar{width:4px}
.panel-body::-webkit-scrollbar-thumb{background:var(--beige-d);border-radius:2px}
.panel-footer{padding:14px 20px;border-top:1px solid var(--beige-d);flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.psec{margin-bottom:22px}
.psec-title{font-size:10px;font-weight:600;color:rgba(43,43,43,.4);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.psec-title::after{content:'';flex:1;height:1px;background:var(--beige-d)}
.item-card{background:var(--beige);border:1px solid var(--beige-d);border-radius:8px;padding:10px 12px;margin-bottom:8px;position:relative}
.item-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.item-card-label{font-size:10px;font-weight:600;color:var(--teal);letter-spacing:.5px;text-transform:uppercase}
.item-delete-btn{width:22px;height:22px;border-radius:4px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(43,43,43,.35);flex-shrink:0;font-size:13px}
.item-delete-btn:hover{background:rgba(184,50,50,.08);color:var(--red)}
.item-fields{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.item-fields.cols3{grid-template-columns:1fr 1fr 1fr}
.item-field{display:flex;flex-direction:column;gap:3px}
.item-field-label{font-size:10px;color:rgba(43,43,43,.45);font-weight:500}
.item-field input,.item-field select{width:100%;font-family:'Inter',sans-serif;font-size:12px;color:var(--dark);background:var(--white);border:1px solid var(--beige-d);border-radius:5px;padding:6px 8px;outline:none}
.item-field input:focus,.item-field select:focus{border-color:var(--teal)}
.add-item-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border-radius:7px;border:1.5px dashed var(--beige-d);background:transparent;color:rgba(43,43,43,.45);font-family:'Inter',sans-serif;font-size:12px;font-weight:500;cursor:pointer;width:100%;margin-top:2px}
.add-item-btn:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-l)}
.servicio-chips{display:flex;flex-wrap:wrap;gap:6px}
.servicio-chip{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;padding:5px 12px;border-radius:99px;border:1.5px solid var(--beige-d);background:var(--white);color:rgba(43,43,43,.55);cursor:pointer;transition:all .15s}
.servicio-chip:hover{border-color:var(--teal)}
.servicio-chip.on{background:var(--teal);color:var(--beige);border-color:var(--teal)}
.servicio-tag{font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:99px;background:rgba(15,61,62,.08);color:var(--teal);white-space:nowrap;display:inline-block;margin:1px}
.servicio-tag.aereo{background:rgba(176,138,90,.18);color:var(--bronze)}
.derived-box{background:var(--teal-l);border-radius:8px;padding:10px 12px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.derived-item{font-size:11px;color:rgba(43,43,43,.55)}
.derived-item b{display:block;font-size:16px;color:var(--teal);font-weight:600;margin-top:2px}
.pct-warning{font-size:11px;margin-top:6px;text-align:right}
.pct-warning.ok{color:var(--green)}
.pct-warning.bad{color:var(--amber)}
.reparto-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.reparto-check{display:flex;align-items:center;gap:5px;font-size:11.5px;color:rgba(43,43,43,.6)}
.reparto-check input{width:14px;height:14px;accent-color:var(--teal)}
.reparto-monto-display{font-size:12px;font-weight:600;color:var(--teal)}
.upload-hint{font-size:11px;color:rgba(43,43,43,.4);margin-top:6px;line-height:1.5}
.panel-save-msg{font-size:11px;color:var(--green);text-align:center;height:16px}

@media (max-width:640px){
  .nav-user{display:none}
  .data-table{font-size:11px}
  .data-table th,.data-table td{padding:8px 8px}
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <div class="login-logo">Be<span>•</span>Travel</div>
    <div class="login-subtitle">Finanzas</div>
    <button class="google-btn" id="btn-google-login" onclick="loginWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continuar con Google
    </button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div class="loading-overlay" id="lo">
  <div class="spinner"></div>
  <div class="loading-text">Conectando con Firebase…</div>
</div>

<!-- NAV -->
<div class="nav">
  <div class="nav-left">
    <div class="nav-brand">Be<span>•</span>Travel — Finanzas</div>
  </div>
  <div class="nav-right">
    <span class="nav-user" id="nav-user-name"></span>
    <div class="sync-pill"><span class="sync-dot" id="sync-dot"></span><span id="sync-label">Conectando…</span></div>
    <a class="nav-btn" href="kanban.html">Prospectos</a>
    <button class="nav-btn" onclick="logout()">Salir</button>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab-btn on" data-tab="resumen" onclick="switchTab('resumen')">Resumen</button>
  <button class="tab-btn" data-tab="reservas" onclick="switchTab('reservas')">Reservas</button>
  <button class="tab-btn" data-tab="facturas" onclick="switchTab('facturas')">Facturas de proveedores</button>
  <button class="tab-btn" data-tab="recordatorios" onclick="switchTab('recordatorios')">Recordatorios</button>
</div>

<!-- MAIN -->
<div class="main">

  <!-- RESUMEN -->
  <div id="view-resumen">

function attachListeners() {

  Object.keys(REFS).forEach(key => {
    REFS[key].on('value', snap => {
      const val = snap.val() || {};

    }, err => { setSyncStatus('err','Error de sync'); console.error(err); });
  });
  META_PROV_REF.on('value', snap => {
    const v = snap.val();

// ── HELPERS ──────────────────────────────────────────────────────────────
function escHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function uid(){ return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function diffDays(dateStr){
  if (!dateStr) return null;
  const d1 = new Date(dateStr+'T00:00:00');
  const d2 = new Date(todayISO()+'T00:00:00');
  return Math.round((d1-d2)/86400000);
}
function fmtMoney(monto, moneda){
  const n = Number(monto)||0;
  const s = n.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (moneda==='USD' ? 'US$ ' : '$ ') + s;
}
function fmtDate(d){
  if (!d) return '—';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}
function objToArr(o){ return o ? Object.keys(o).map(id => ({ id, ...o[id] })) : []; }
// Convierte un monto de una moneda a otra usando un tipo de cambio (ARS por USD).
// Se usa para pagos en otra moneda que la reserva, y para valor cotizado / costo total
// cuando cada uno está cargado en una moneda distinta (ej: cobrás en pesos, el proveedor
// te cobra en dólares).
function convertMonto(monto, monedaOrigen, monedaDestino, tc){
  if (!monedaOrigen || monedaOrigen===monedaDestino) return { value: monto, note: null };
  const t = Number(tc)||0;
  if (t<=0) return { value: 0, note: 'falta-tc' };
  if (monedaDestino==='USD' && monedaOrigen==='ARS') return { value: monto / t, note: 'ok' };
  if (monedaDestino==='ARS' && monedaOrigen==='USD') return { value: monto * t, note: 'ok' };
  return { value: monto, note: null };
}
function pagosSum(pagosArr){ return (pagosArr||[]).reduce((s,p) => s + (Number(p.monto)||0), 0); }
function pagosEquivSum(pagosArr, monedaReserva){
  return (pagosArr||[]).reduce((s,p) => s + convertMonto(Number(p.monto)||0, p.moneda||monedaReserva, monedaReserva, p.tipoCambio).value, 0);
}
// Valor cotizado y costo total pueden estar cargados cada uno en una moneda distinta a la
// moneda de referencia de la reserva; se convierten con el tipo de cambio de cotización.
function reservaValorCotizadoEnRef(r){
  return convertMonto(Number(r.valorCotizado)||0, r.valorCotizadoMoneda||r.moneda, r.moneda, r.tipoCambioCotizacion).value;
}
function reservaCostoTotalEnRef(r){
  return convertMonto(Number(r.costoTotal)||0, r.costoTotalMoneda||r.moneda, r.moneda, r.tipoCambioCotizacion).value;
}
function reservaSaldo(r){ return reservaValorCotizadoEnRef(r) - pagosEquivSum(objToArr(r.pagos), r.moneda); }
function reservaMargen(r){ return reservaValorCotizadoEnRef(r) - reservaCostoTotalEnRef(r); }

const DONE_STATES = { facturas:'pagada' };
function isDone(kind, item){
  if (kind==='recordatorios') return !!item.resuelto;
  if (kind==='reservas') return item.estado==='cerrada' || item.estado==='cancelada' || item.estado==='pagada' || reservaSaldo(item)<=0;
  return item.estado === DONE_STATES[kind];
}
function urgency(kind, item){
  if (isDone(kind, item)) return 'done';
  const days = diffDays(item.fecha);
  if (days==null) return 'ok';
  if (days<0) return 'vencido';
  if (days<=15) return 'proximo';
  return 'ok';
}
function badgeHtml(kind, item){
  const u = urgency(kind, item);
  const doneLabel = kind==='recordatorios' ? 'Resuelto' : kind==='reservas' ? 'Saldada' : 'Pagado';
  const labels = { vencido:'Vencido', proximo:'Próximo', ok:'OK', done: doneLabel };
  return `<span class="badge ${u}">${labels[u]}</span>`;
}
const ESTADO_RESERVA_LABELS = { cotizada:'Cotizada', confirmada:'Confirmada', pagada:'Pagada', cerrada:'Cerrada', cancelada:'Cancelada' };
function estadoReservaBadgeHtml(estado){
  const e = estado || 'cotizada';
  return `<span class="badge estado-${e}">${ESTADO_RESERVA_LABELS[e] || e}</span>`;
}
function facturacionBadgeHtml(f){
  const facturada = !!(f && f.facturada);
  return `<span class="badge ${facturada?'fact-facturada':'fact-pendiente'}">${facturada?'Facturada':'Pendiente'}</span>`;
}

const TABLE_CONFIG = {
  facturas: {
    cols: item => [escHtml(item.proveedor||'—'), escHtml(item.concepto||''), `<span class="money ${item.moneda==='USD'?'usd':''}">${fmtMoney(item.monto,item.moneda)}</span>`, fmtDate(item.fecha), badgeHtml('facturas',item)]
  },
  recordatorios: {
    cols: item => [escHtml(item.tipo||'Otro'), escHtml(item.titulo||'—'), fmtDate(item.fecha), escHtml(RECUR_LABELS[item.recurrencia]||'Ninguna'), badgeHtml('recordatorios',item)]
  }
};
const RECUR_LABELS = { ninguna:'Ninguna', semanal:'Semanal', quincenal:'Quincenal', mensual:'Mensual' };

function renderTable(kind){
  const tbody = document.getElementById('tbody-'+kind);
  let items = [...STATE[kind]].sort((a,b) => (a.fecha||'9999').localeCompare(b.fecha||'9999'));
  let hiddenCount = 0;
  if (kind==='recordatorios'){
    const total = items.length;
    items = items.filter(item => !item.fecha || diffDays(item.fecha) >= 0);
    hiddenCount = total - items.length;
    const hint = document.getElementById('recordatorios-hidden-hint');
    if (hint) hint.textContent = hiddenCount ? `${hiddenCount} recordatorio(s) pasado(s) oculto(s).` : '';
  }
  if (!items.length){
    tbody.innerHTML = `<tr><td colspan="5" class="table-empty">${hiddenCount ? 'Todos los recordatorios cargados ya pasaron.' : 'Todavía no cargaste nada acá.'}</td></tr>`;
    return;
  }
  tbody.innerHTML = items.map(item => {
    const cols = TABLE_CONFIG[kind].cols(item).map(c => `<td>${c}</td>`).join('');
    return `<tr onclick="openForm('${kind}','${item.id}')">${cols}</tr>`;
  }).join('');
}

// ── TABLA DE RESERVAS: columnas ordenables y filtrables ─────────────────────
const RESERVAS_COLS = [
  { key:'cliente', label:'Cliente', type:'text', get:r => r.cliente||'' },
  { key:'concepto', label:'Concepto', type:'text', get:r => r.concepto||'' },
  { key:'servicios', label:'Servicios', type:'text', get:r => (r.servicios||[]).join(', ') },
  { key:'pasajeros', label:'Pax', type:'number', get:r => Number(r.pasajeros)||0 },
  { key:'fechaCotizacion', label:'Fecha de cotización', type:'date', get:r => r.fechaCotizacion||'' },
  { key:'fecha', label:'Fecha de viaje', type:'date', get:r => r.fecha||'' },
  { key:'valorCotizado', label:'Valor cotizado', type:'number', get:r => reservaValorCotizadoEnRef(r) },
  { key:'saldo', label:'Saldo pendiente', type:'number', get:r => reservaSaldo(r) },
  { key:'margen', label:'Margen', type:'number', get:r => reservaMargen(r) },
  { key:'estado', label:'Estado', type:'select', options: ESTADO_RESERVA_LABELS, get:r => r.estado||'cotizada' },
  { key:'facturacion', label:'Facturación', type:'select', options: { si:'Facturada', no:'Pendiente' }, get:r => (r.facturacion && r.facturacion.facturada) ? 'si' : 'no' },
];
let reservasSort = { key:'fecha', dir:1 };
let reservasFilters = {};

function buildReservasThead(){
  const headCells = RESERVAS_COLS.map(c => {
    const active = reservasSort.key===c.key;
    const arrow = active ? (reservasSort.dir===1 ? ' ▲' : ' ▼') : '';
    return `<th class="sortable-th${active?' active':''}" onclick="setReservasSort('${c.key}')">${c.label}${arrow}</th>`;
  }).join('');
  const filterCells = RESERVAS_COLS.map(c => {
    const current = reservasFilters[c.key] || '';
    if (c.type==='select'){
      const opts = Object.keys(c.options).map(v => `<option value="${v}" ${v===current?'selected':''}>${escHtml(c.options[v])}</option>`).join('');
      return `<th><select class="col-filter" onclick="event.stopPropagation()" onchange="setReservasFilter('${c.key}',this.value)"><option value="">Todos</option>${opts}</select></th>`;
    }
    return `<th><input class="col-filter" type="text" placeholder="Filtrar…" value="${escHtml(current)}" onclick="event.stopPropagation()" oninput="setReservasFilter('${c.key}',this.value)"></th>`;
  }).join('');
  return `<tr>${headCells}</tr><tr class="filter-row">${filterCells}</tr>`;
}
function initReservasThead(){
  document.getElementById('thead-reservas').innerHTML = buildReservasThead();
}
function setReservasSort(key){
  if (reservasSort.key===key) reservasSort.dir *= -1;
  else reservasSort = { key, dir:1 };
  initReservasThead();
  renderReservasTable();
}
function setReservasFilter(key, value){
  reservasFilters[key] = value;
  renderReservasTable();
}

function reservaRowHtml(r){
  const saldo = reservaSaldo(r);
  const margen = reservaMargen(r);
  const usd = r.moneda==='USD' ? 'usd' : '';
  // El valor cotizado puede estar cargado en una moneda distinta a la de referencia
  // de la reserva: se muestra con SU propia moneda, no la de saldo/margen.
  const valorMoneda = r.valorCotizadoMoneda || r.moneda;
  const usdValor = valorMoneda==='USD' ? 'usd' : '';
  const servicios = (r.servicios||[]).map(s => `<span class="servicio-tag ${s==='Aéreo'?'aereo':''}">${escHtml(s)}</span>`).join('') || '—';
  return `<tr onclick="openReserva('${r.id}')">
    <td>${escHtml(r.cliente||'—')}</td>
    <td>${escHtml(r.concepto||'')}</td>
    <td>${servicios}</td>
    <td>${r.pasajeros ? escHtml(Number(r.pasajeros).toLocaleString('es-AR')) : '—'}</td>
    <td>${fmtDate(r.fechaCotizacion)}</td>
    <td>${fmtDate(r.fecha)}</td>
    <td><span class="money ${usdValor}">${fmtMoney(r.valorCotizado, valorMoneda)}</span></td>
    <td><span class="money ${usd}">${fmtMoney(saldo,r.moneda)}</span></td>
    <td><span class="money ${usd}">${fmtMoney(margen,r.moneda)}</span></td>
    <td>${estadoReservaBadgeHtml(r.estado)}</td>
    <td>${facturacionBadgeHtml(r.facturacion)}</td>
  </tr>`;
}

function renderReservasTable(){
  const tbody = document.getElementById('tbody-reservas');
  let items = [...STATE.reservas];

  RESERVAS_COLS.forEach(c => {
    const fv = reservasFilters[c.key];
    if (!fv) return;
    if (c.type==='select'){
      items = items.filter(r => c.get(r)===fv);
    } else if (c.type==='number'){
      items = items.filter(r => String(c.get(r)).includes(fv));
    } else {
      items = items.filter(r => c.get(r).toLowerCase().includes(fv.toLowerCase()));
    }
  });

  const sortCol = RESERVAS_COLS.find(c => c.key===reservasSort.key) || RESERVAS_COLS.find(c => c.key==='fecha');
  items.sort((a,b) => {
    let av = sortCol.get(a), bv = sortCol.get(b);
    if (sortCol.type==='number'){ return ((Number(av)||0) - (Number(bv)||0)) * reservasSort.dir; }
    av = String(av||''); bv = String(bv||'');
    return av.localeCompare(bv) * reservasSort.dir;
  });

  if (!items.length){
    const msg = STATE.reservas.length ? 'Ningún resultado con estos filtros.' : 'Todavía no cargaste ninguna reserva.';
    tbody.innerHTML = `<tr><td colspan="${RESERVAS_COLS.length}" class="table-empty">${msg}</td></tr>`;
    return;
  }
  tbody.innerHTML = items.map(reservaRowHtml).join('');
}
initReservasThead();

// Un reparto puede liquidarse en una moneda distinta a la de referencia de la reserva
// (ej: margen calculado en ARS, pero le pagás la parte a un ejecutivo en USD).
function repartoMontoEnSuMoneda(r, rep){
  const margen = reservaMargen(r);
  const montoRef = margen * (Number(rep.porcentaje)||0) / 100;
  const repMoneda = rep.moneda || r.moneda;
  return convertMonto(montoRef, r.moneda, repMoneda, rep.tipoCambio);
}

function computeReservaTotals(){
  const cobrar = { ARS:0, USD:0 };
  const repartoT = { ARS:0, USD:0 };
  STATE.reservas.forEach(r => {
    if (r.estado==='cancelada') return;
    const moneda = r.moneda==='USD' ? 'USD' : 'ARS';
    const saldo = reservaSaldo(r);
    if (r.estado!=='cerrada' && r.estado!=='pagada' && saldo>0) cobrar[moneda] += saldo;
    objToArr(r.reparto).forEach(rep => {
      if (rep.pagado) return;
      const conv = repartoMontoEnSuMoneda(r, rep);
      if (conv.note==='falta-tc') return;
      const repMoneda = rep.moneda==='USD' ? 'USD' : 'ARS';
      repartoT[repMoneda] += conv.value;
    });
  });
  return { cobrar, repartoT };
}

function renderResumen(){
  const sumPend = (kind, doneVal) => {
    const totals = { ARS:0, USD:0 };
    STATE[kind].forEach(item => {
      if (item.estado === doneVal) return;
      totals[item.moneda==='USD'?'USD':'ARS'] += Number(item.monto)||0;
    });
    return totals;
  };
  const { cobrar, repartoT } = computeReservaTotals();
  const facturasT = sumPend('facturas','pagada');
  const bspT = { ARS:0, USD:0 };
  STATE.recordatorios.forEach(item => {
    if (item.tipo!=='BSP' || item.resuelto) return;
    bspT[item.moneda==='USD'?'USD':'ARS'] += Number(item.monto)||0;
  });
  const porPagarT = { ARS: facturasT.ARS + bspT.ARS, USD: facturasT.USD + bspT.USD };

  const allItems = [];
  ['reservas','facturas','recordatorios'].forEach(kind => {
    STATE[kind].forEach(item => {
      if (isDone(kind, item)) return;
      const days = diffDays(item.fecha);
      if (days==null) return;
      allItems.push({ kind, item, days });
    });
  });
  const vencidos = allItems.filter(x => x.days<0).sort((a,b)=>a.days-b.days);
  const proximos = allItems.filter(x => x.days>=0 && x.days<=15).sort((a,b)=>a.days-b.days);

  const cardAmounts = (t) => {
    const parts = [];
    if (t.ARS) parts.push(`<div class="stat-amount">${fmtMoney(t.ARS,'ARS')}</div>`);
    if (t.USD) parts.push(`<div class="stat-amount" style="color:var(--bronze)">${fmtMoney(t.USD,'USD')}</div>`);
    if (!parts.length) parts.push(`<div class="stat-amount empty">Sin pendientes</div>`);
    return parts.join('');
  };

  document.getElementById('stat-cards').innerHTML = `
    <div class="stat-card"><h4>Por cobrar de clientes</h4><div class="stat-amounts">${cardAmounts(cobrar)}</div></div>
    <div class="stat-card"><h4>Por pagar a proveedores</h4><div class="stat-amounts">${cardAmounts(porPagarT)}</div></div>
    <div class="stat-card"><h4>Reparto pendiente a ejecutivos</h4><div class="stat-amounts">${cardAmounts(repartoT)}</div></div>
    <div class="stat-card alert"><h4>Alertas activas</h4><div class="stat-amounts"><div class="stat-amount">${vencidos.length + proximos.length}</div></div></div>
  `;

  const rowHtml = (x, isOverdue) => {
    const title = TITLE_FIELD[x.kind](x.item);
    const money = x.item.monto ? `<div class="alert-amount">${fmtMoney(x.item.monto, x.item.moneda)}</div>` : '';
    const daysLabel = isOverdue ? `Hace ${Math.abs(x.days)}d` : (x.days===0?'Hoy':`En ${x.days}d`);
    return `<div class="alert-row" onclick="jumpTo('${x.kind}','${x.item.id}')">
      <div><div class="alert-title">${escHtml(title)}</div><div class="alert-sub">${KIND_LABEL[x.kind]}</div></div>
      <div class="alert-meta"><div class="alert-days">${daysLabel}</div>${money}</div>
    </div>`;
  };
  document.getElementById('count-vencidos').textContent = vencidos.length ? `(${vencidos.length})` : '';
  document.getElementById('list-vencidos').innerHTML = vencidos.length
    ? vencidos.map(x => rowHtml(x,true)).join('')
    : `<div class="empty-msg">Sin vencidos. 👍</div>`;
  document.getElementById('list-proximos').innerHTML = proximos.length
    ? proximos.map(x => rowHtml(x,false)).join('')
    : `<div class="empty-msg">Nada en los próximos 15 días.</div>`;

  const porEjecutivo = computeRepartoPorEjecutivo();
  const nombres = Object.keys(porEjecutivo).sort((a,b) => (porEjecutivo[b].ARS+porEjecutivo[b].USD) - (porEjecutivo[a].ARS+porEjecutivo[a].USD));
  document.getElementById('list-reparto-ejecutivos').innerHTML = nombres.length
    ? nombres.map(nombre => {
        const t = porEjecutivo[nombre];
        const parts = [];
        if (t.ARS) parts.push(`<div class="alert-amount">${fmtMoney(t.ARS,'ARS')}</div>`);
        if (t.USD) parts.push(`<div class="alert-amount" style="color:var(--bronze)">${fmtMoney(t.USD,'USD')}</div>`);
        return `<div class="alert-row"><div class="alert-title">${escHtml(nombre)}</div><div class="alert-meta">${parts.join('')}</div></div>`;
      }).join('')
    : `<div class="empty-msg">Sin reparto pendiente.</div>`;
}
function computeRepartoPorEjecutivo(){
  const map = {};
  STATE.reservas.forEach(r => {
    if (r.estado==='cancelada') return;
    objToArr(r.reparto).forEach(rep => {
      if (rep.pagado || !rep.ejecutivo) return;
      const conv = repartoMontoEnSuMoneda(r, rep);
      if (conv.note==='falta-tc') return;
      const repMoneda = rep.moneda==='USD' ? 'USD' : 'ARS';
      if (!map[rep.ejecutivo]) map[rep.ejecutivo] = { ARS:0, USD:0 };
      map[rep.ejecutivo][repMoneda] += conv.value;
    });
  });
  return map;
}

// Encuentra a qué período BSP corresponde una fecha de emisión de billete aéreo.
function findBspPeriod(fechaEmision){
  return BSP_CALENDAR_2026.find(([, desde, hasta]) => fechaEmision >= desde && fechaEmision <= hasta) || null;
}

function buildAutoNote(arsSum, usdSum){
  const parts = [];
  if (arsSum>0) parts.push(fmtMoney(arsSum,'ARS'));
  if (usdSum>0) parts.push(fmtMoney(usdSum,'USD'));
  return parts.length ? `[Auto] Costo aéreo emitido en este período: ${parts.join(' + ')}.` : '';
}
function mergeAutoNote(existingNotas, autoLine){
  const lines = (existingNotas||'').split('\n').filter(l => !l.startsWith('[Auto]'));
  if (autoLine) lines.unshift(autoLine);
  return lines.join('\n').trim();
}

// Suma el costo de los aéreos (según fecha de emisión) al recordatorio BSP del período
// que corresponda, creándolo si todavía no existe. Se dispara solo cuando ya cargaron
// tanto las reservas como los recordatorios, y solo escribe si algo realmente cambió.
function syncBspRecordatorios(){
  const sums = {};
  STATE.reservas.forEach(r => {
    if (!(r.servicios||[]).includes('Aéreo')) return;
    const costo = Number(r.aereoCosto)||0;
    if (!costo || !r.aereoFechaEmision) return;
    const period = findBspPeriod(r.aereoFechaEmision);
    if (!period) return;
    const moneda = r.aereoMoneda==='USD' ? 'USD' : 'ARS';
    if (!sums[period[0]]) sums[period[0]] = { ARS:0, USD:0, fecha: period[3] };
    sums[period[0]][moneda] += costo;
  });

  const updates = {};
  Object.keys(sums).forEach(periodo => {
    const { ARS: arsSum, USD: usdSum, fecha } = sums[periodo];
    const autoLine = buildAutoNote(arsSum, usdSum);
    if (!autoLine) return;
    const monto = arsSum>0 ? arsSum : usdSum;
    const moneda = arsSum>0 ? 'ARS' : 'USD';
    const rec = STATE.recordatorios.find(x => x.tipo==='BSP' && x.fecha===fecha);
    if (rec){
      const newNotas = mergeAutoNote(rec.notas, autoLine);
      if (Number(rec.monto)!==monto || rec.moneda!==moneda || rec.notas!==newNotas){
        REFS.recordatorios.child(rec.id).update({ monto, moneda, notas:newNotas });
      }
    } else {
      const key = REFS.recordatorios.push().key;
      updates[key] = {
        tipo:'BSP', titulo:`Pago BSP aéreo — período ${periodo}`, fecha,
        recurrencia:'semanal', monto, moneda, notas:autoLine, resuelto:false,
      };
    }
  });
  if (Object.keys(updates).length) REFS.recordatorios.update(updates);
}

  recalcReparto();
}

function getNum(id){ const el=document.getElementById(id); return el ? (parseFloat(el.value)||0) : 0; }

// Lee valor cotizado / costo total del formulario y los convierte a la moneda de
// referencia de la reserva (usando el TC de cotización) cuando cada uno está cargado
// en una moneda distinta.
function getCurrentMargen(){
  const moneda = document.getElementById('r-moneda')?.value || 'ARS';
  const tc = getNum('r-tc-cotizacion');
  const valorMoneda = document.getElementById('r-valorCotizado-moneda')?.value || moneda;
  const costoMoneda = document.getElementById('r-costoTotal-moneda')?.value || moneda;
  const valorConv = convertMonto(getNum('r-valorCotizado'), valorMoneda, moneda, tc);
  const costoConv = convertMonto(getNum('r-costoTotal'), costoMoneda, moneda, tc);
  const ok = valorConv.note!=='falta-tc' && costoConv.note!=='falta-tc';
  return { margen: valorConv.value - costoConv.value, moneda, ok, valorConv, costoConv };
}

function recalcDerived(){
  const { margen, moneda, ok, valorConv, costoConv } = getCurrentMargen();

  let pagosTotal = 0;
  document.querySelectorAll('.pago-row').forEach(row => {
    const monto = parseFloat(row.querySelector('.pago-monto').value)||0;
    const pMoneda = row.querySelector('.pago-moneda').value;
    const tc = row.querySelector('.pago-tc').value;
    const conv = convertMonto(monto, pMoneda, moneda, tc);
    pagosTotal += conv.value;
    const equivEl = row.querySelector('.pago-equiv');
    if (!equivEl) return;
    if (pMoneda === moneda){
      equivEl.textContent = '';
    } else if (conv.note === 'falta-tc'){
      equivEl.textContent = '⚠ Ingresá el tipo de cambio para convertir este pago — no se está sumando al saldo.';
      equivEl.style.color = 'var(--amber)';
    } else {
      equivEl.textContent = `≈ ${fmtMoney(conv.value, moneda)}`;
      equivEl.style.color = 'rgba(43,43,43,.5)';
    }
  });
  const saldo = valorConv.value - pagosTotal;

  const mEl = document.getElementById('derived-margen');
  if (mEl) mEl.textContent = ok ? fmtMoney(margen, moneda) : '⚠ Falta TC';
  const sEl = document.getElementById('derived-saldo');
  if (sEl) sEl.textContent = valorConv.note==='falta-tc' ? '⚠ Falta TC' : fmtMoney(saldo, moneda);
  const tcWarn = document.getElementById('tc-cotizacion-warning');
  if (tcWarn) tcWarn.textContent = !ok ? 'Valor cotizado y costo total están en monedas distintas: ingresá el tipo de cambio de cotización para calcular el margen.' : '';

  recalcReparto(margen, moneda);
}
function recalcReparto(margenOverride, monedaOverride){
  const current = getCurrentMargen();
  const moneda = monedaOverride || current.moneda; // moneda de referencia de la reserva (donde está el margen)
  const margen = margenOverride!=null ? margenOverride : current.margen;
  const rows = document.querySelectorAll('.reparto-row');
  let sumPct = 0;
  rows.forEach(row => {
    const pct = parseFloat(row.querySelector('.reparto-pct').value)||0;
    sumPct += pct;
    const rowMoneda = row.querySelector('.reparto-moneda')?.value || moneda;
    const tc = row.querySelector('.reparto-tc')?.value;
    const conv = convertMonto(margen*pct/100, moneda, rowMoneda, tc);
    const disp = row.querySelector('.reparto-monto-display');
    if (!disp) return;
    if (conv.note==='falta-tc'){
      disp.textContent = '⚠ Falta TC';
      disp.style.color = 'var(--amber)';
    } else {
      disp.textContent = fmtMoney(conv.value, rowMoneda);
      disp.style.color = 'var(--teal)';
    }
  });
  const warn = document.getElementById('pct-warning');
  if (!warn) return;
  if (!rows.length){ warn.textContent=''; warn.className='pct-warning'; }
  else if (Math.abs(sumPct-100)<0.05){ warn.textContent='Suma 100% ✓'; warn.className='pct-warning ok'; }
  else { warn.textContent = `Suma ${sumPct.toFixed(1).replace('.',',')}% (no da 100%)`; warn.className='pct-warning bad'; }
}

        <div><label class="fl">Moneda</label><select class="fsel" id="r-costoTotal-moneda" onchange="recalcDerived()">${selOpts(['ARS','USD'],['ARS','USD'],d.costoTotalMoneda||d.moneda||'ARS')}</select></div>

function reservaMargenLocal(d){ return (Number(d.valorCotizado)||0) - (Number(d.costoTotal)||0); }

function comprobanteRowHtml(c){
  return `<div class="item-card comprobante-row" data-row-id="${c.id}">
    <div class="item-card-header"><span class="item-card-label">Comprobante</span><button type="button" class="item-delete-btn" onclick="this.closest('.comprobante-row').remove()">✕</button></div>
    <div class="item-fields">
      <div class="item-field"><span class="item-field-label">Nombre</span><input class="comprobante-nombre" value="${escHtml(c.nombre)}" placeholder="Ej: Factura Tucano #123"></div>
      <div class="item-field"><span class="item-field-label">Link</span><input class="comprobante-url" type="url" value="${escHtml(c.url)}" placeholder="https://drive.google.com/…"></div>
    </div>
  </div>`;
}
function addComprobante(){
  document.getElementById('comprobantes-list').insertAdjacentHTML('beforeend', comprobanteRowHtml({ id:'new_'+uid(), nombre:'', url:'' }));
}

function toggleFacturacionFields(){
  const box = document.getElementById('facturacion-fields');
  const checked = document.getElementById('r-fact-facturada')?.checked;
  if (box) box.style.display = checked ? '' : 'none';
}

function toggleServicioChip(btn){
  btn.classList.toggle('on');
  if (btn.dataset.servicio === 'Aéreo'){
    const box = document.getElementById('aereo-fields');
    if (box) box.style.display = btn.classList.contains('on') ? '' : 'none';
  }
}

function saveReserva(){
  const servicios = [...document.querySelectorAll('.servicio-chip.on')].map(el => el.dataset.servicio);
  const esAereo = servicios.includes('Aéreo');
  const val = {
    cliente: gv('r-cliente'), concepto: gv('r-concepto'),
    servicios,
    moneda: gv('r-moneda'),
    valorCotizado: getNum('r-valorCotizado'), valorCotizadoMoneda: gv('r-valorCotizado-moneda'),
    costoTotal: getNum('r-costoTotal'), costoTotalMoneda: gv('r-costoTotal-moneda'),
    tipoCambioCotizacion: parseFloat(gv('r-tc-cotizacion'))||'',
    estado: gv('r-estado'), fechaCotizacion: gv('r-fecha-cotizacion'), fecha: gv('r-fecha'),
    pasajeros: parseInt(gv('r-pasajeros'),10)||'', notas: gv('r-notas'),
    aereoCosto: esAereo ? (getNum('r-aereo-costo')||'') : '',
    aereoMoneda: esAereo ? gv('r-aereo-moneda') : '',
    aereoFechaEmision: esAereo ? gv('r-aereo-fecha-emision') : '',
    facturacion: {
      facturada: document.getElementById('r-fact-facturada').checked,
      fecha: gv('r-fact-fecha'),
      concepto: gv('r-fact-concepto'),
      monto: getNum('r-fact-monto') || '',
      moneda: gv('r-fact-moneda'),
      numero: gv('r-fact-numero'),
    },
    pagos: {}, reparto: {}, comprobantes: {}
  };
  document.querySelectorAll('.pago-row').forEach(row => {
    const rowId = row.dataset.rowId;
    const rid = rowId.startsWith('new_') ? REFS.reservas.push().key : rowId;
    val.pagos[rid] = {
      fecha: row.querySelector('.pago-fecha').value,
      monto: parseFloat(row.querySelector('.pago-monto').value)||0,
      moneda: row.querySelector('.pago-moneda').value,
      tipoCambio: parseFloat(row.querySelector('.pago-tc').value)||'',
      medio: row.querySelector('.pago-medio').value,
    };
  });
  document.querySelectorAll('.reparto-row').forEach(row => {
    const rowId = row.dataset.rowId;
    const rid = rowId.startsWith('new_') ? REFS.reservas.push().key : rowId;
    const ejecutivo = row.querySelector('.reparto-ejec').value.trim();
    val.reparto[rid] = {
      ejecutivo,
      porcentaje: parseFloat(row.querySelector('.reparto-pct').value)||0,
      moneda: row.querySelector('.reparto-moneda').value,
      tipoCambio: parseFloat(row.querySelector('.reparto-tc').value)||'',
      pagado: row.querySelector('.reparto-pagado').checked,
    };
    if (ejecutivo && !META.ejecutivos.includes(ejecutivo)) META_EJEC_REF.set([...META.ejecutivos, ejecutivo]);
  });
  document.querySelectorAll('.comprobante-row').forEach(row => {
    const rowId = row.dataset.rowId;
    const rid = rowId.startsWith('new_') ? REFS.reservas.push().key : rowId;
    const nombre = row.querySelector('.comprobante-nombre').value.trim();
    const url = row.querySelector('.comprobante-url').value.trim();
    if (!nombre && !url) return;
    val.comprobantes[rid] = { nombre, url };
  });

  const id = reservaCtx.id;
  const ref = id ? REFS.reservas.child(id) : REFS.reservas.push();
  ref.set(val).then(() => {
    const newId = id || ref.key;
    reservaCtx = { id:newId, data: toEditable(val) };
    document.getElementById('panel-title').textContent = 'Editar reserva';
    document.getElementById('reserva-delete-btn').style.display = 'block';
    renderReservaPanel();
    const msg = document.getElementById('panel-save-msg');
    if (msg){ msg.textContent = 'Guardado ✓'; setTimeout(()=>{ if (msg) msg.textContent=''; }, 2500); }
  }).catch(err => { console.error(err); alert('Error al guardar. Revisá tu conexión o los permisos de la base.'); });
}
function gv(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }

function deleteReserva(){
  if (!reservaCtx.id) return;
  if (!confirm('¿Eliminar esta reserva y todos sus datos? No se puede deshacer.')) return;
  REFS.reservas.child(reservaCtx.id).remove();
  closeReserva();
}
