<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Datos de pasajeros | Be•Travel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#0F3D3E;--beige:#E6E1D8;--beige-d:#D5CEC3;--dark:#2B2B2B;--bronze:#B08A5A;--white:#fff;--red:#b83232}
body{font-family:'Inter',sans-serif;background:var(--beige);color:var(--dark);-webkit-font-smoothing:antialiased;line-height:1.5}
.top{background:var(--teal);padding:16px 20px}
.brand{font-size:17px;font-weight:600;color:var(--beige);letter-spacing:-.3px}
.brand span{color:var(--bronze)}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:22px;font-weight:600;color:var(--teal);letter-spacing:-.4px;margin-bottom:6px}
.lead{font-size:14px;color:rgba(43,43,43,.75);margin-bottom:22px}
.card{background:var(--white);border:1px solid var(--beige-d);border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{font-size:13px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--teal);margin-bottom:14px}
.fld{margin-bottom:14px}
.fld:last-child{margin-bottom:0}
.fld label,.fld .lbl{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
.req{color:var(--red)}
.hint{font-size:12px;color:rgba(43,43,43,.6);margin-top:4px}
input[type=text],input[type=email],input[type=tel],input[type=date],select,textarea{width:100%;font-family:'Inter',sans-serif;font-size:15px;padding:10px 12px;border:1.5px solid var(--beige-d);border-radius:8px;background:var(--white);color:var(--dark);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--teal)}
textarea{min-height:80px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:8px 18px}
.opt{display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer}
.opt input{width:17px;height:17px;accent-color:var(--teal)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid .fld{margin:0;grid-column:1/-1}
.grid .fld.half{grid-column:auto}
.info{font-size:13px;color:rgba(43,43,43,.75);white-space:pre-line}
.err{font-size:12px;color:var(--red);margin-top:4px;display:none}
.fld.bad .err{display:block}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--red)}
.btn{width:100%;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;padding:13px;border-radius:9px;border:none;background:var(--teal);color:var(--beige);cursor:pointer}
.btn:disabled{opacity:.55;cursor:default}
.msg{background:var(--white);border:1px solid var(--beige-d);border-radius:12px;padding:28px 22px;text-align:center}
.msg h2{font-size:18px;color:var(--teal);margin-bottom:8px}
.msg p{font-size:14px;color:rgba(43,43,43,.8)}
.btn-sec{max-width:260px;margin:18px auto 0;display:block}
.combo{position:relative}
.sugs{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--white);border:1.5px solid var(--beige-d);border-radius:8px;max-height:240px;overflow-y:auto;z-index:20;box-shadow:0 6px 18px rgba(15,61,62,.12)}
.sug{padding:10px 12px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.sug:hover,.sug.on{background:rgba(15,61,62,.07)}
.sug small{font-size:11px;color:rgba(43,43,43,.55);white-space:nowrap}
.sug-vacio{padding:10px 12px;font-size:13px;color:rgba(43,43,43,.6)}
.hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
.hidden{display:none!important}
.alert{background:rgba(184,50,50,.08);border:1px solid rgba(184,50,50,.3);color:var(--red);font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:12px}
@media(max-width:520px){.grid{grid-template-columns:1fr}.grid .fld.half{grid-column:1/-1}}
</style>
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<div class="top"><div class="brand">Be<span>•</span>Travel</div></div>
<div class="wrap">

  <div class="msg" id="estado"><p>Cargando…</p></div>

  <form id="form" class="hidden" novalidate autocomplete="off">
    <h1 id="titulo"></h1>
    <p class="lead" id="intro"></p>

    <div class="hp" aria-hidden="true"><label>Sitio web<input type="text" id="hp" tabindex="-1" autocomplete="off"></label></div>

    <div class="card" id="card-lista">
      <h2>Identificación</h2>
      <div class="fld" data-f="invitado">
        <label for="invitado">Seleccione su nombre en la lista <span class="req">*</span></label>
        <select id="invitado"></select>
        <div class="err">Seleccione una opción.</div>
      </div>
    </div>

    <div id="campos"></div>

    <div class="alert hidden" id="alerta"></div>
    <button type="submit" class="btn" id="enviar">Enviar datos</button>
  </form>
</div>

<script src="form-default.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// Sin login: el grupo se identifica con un token no adivinable en la URL (?g=...).
// Las reglas de Firebase solo permiten crear respuestas nuevas mientras el grupo esté activo.
// Las preguntas vienen de grupos/{g}/meta/form (armado en admin/grupos.html) o de FORM_DEFAULT.
firebase.initializeApp({
  apiKey:"AIzaSyARJ-zVCszUxJ_Fs1UBBtMiQvjuDF98IYI",
  authDomain:"betravel-kanban.firebaseapp.com",
  databaseURL:"https://betravel-kanban-default-rtdb.firebaseio.com",
  projectId:"betravel-kanban",
  storageBucket:"betravel-kanban.firebasestorage.app",
  messagingSenderId:"644328296494",
  appId:"1:644328296494:web:aec3842de80021159f8fbf",
});
const $ = id => document.getElementById(id);
const GID = (new URLSearchParams(location.search).get('g') || '').trim();
const OTRO = '__otro';
const INTRO_DEF = 'Completen sus datos tal como figuran en el pasaporte. La información se utiliza únicamente para organizar el viaje del grupo.';
let INVITADOS = [], FORM = [], Q = {};

function mostrarMsg(titulo, texto, accion){
  $('form').classList.add('hidden');
  const e = $('estado'); e.classList.remove('hidden');
  e.innerHTML = '<h2></h2><p></p>';
  e.querySelector('h2').textContent = titulo;
  e.querySelector('p').textContent = texto;
  if (accion){
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn btn-sec';
    b.textContent = accion.texto; b.addEventListener('click', accion.onClick); e.appendChild(b);
  }
}
// Recarga con el mismo ?g= para dejar el formulario en blanco, sin estado arrastrado
const nuevoFormulario = () => { location.href = location.pathname + location.search; };

if (!/^[A-Za-z0-9_-]{8,64}$/.test(GID)){
  mostrarMsg('Enlace no válido', 'Verifique que el enlace esté completo o solicite uno nuevo a Be•Travel.');
} else {
  firebase.database().ref('grupos/' + GID + '/meta').once('value').then(s => {
    const meta = s.val();
    if (!meta) return mostrarMsg('Enlace no válido', 'Verifique que el enlace esté completo o solicite uno nuevo a Be•Travel.');
    if (meta.activo !== true) return mostrarMsg('Formulario cerrado', 'Este formulario ya no recibe respuestas. Si necesita modificar sus datos, escríbanos.');
    iniciar(meta);
  }, () => mostrarMsg('No pudimos cargar el formulario', 'Revise su conexión e intente nuevamente en unos minutos.'));
}

function listaForm(meta){
  const f = meta.form;
  const arr = !f ? window.FORM_DEFAULT : Array.isArray(f) ? f : Object.keys(f).sort((a, b) => a - b).map(k => f[k]);
  return arr.filter(q => q && q.id && q.tipo);
}

function iniciar(meta){
  document.title = 'Datos de pasajeros — ' + meta.nombre + ' | Be•Travel';
  $('titulo').textContent = 'Lista de pasajeros — ' + meta.nombre;
  $('intro').textContent = meta.intro || INTRO_DEF;
  INVITADOS = meta.invitados ? Object.values(meta.invitados).filter(Boolean) : [];
  if (INVITADOS.length){
    const sel = $('invitado');
    sel.innerHTML = '<option value="">Seleccione…</option>' + INVITADOS.map(() => '<option></option>').join('') + '<option value="' + OTRO + '">Mi nombre no figura en la lista</option>';
    INVITADOS.forEach((n, i) => { sel.options[i + 1].value = n; sel.options[i + 1].textContent = n; });
  } else {
    $('card-lista').classList.add('hidden');
  }
  FORM = listaForm(meta); Q = {}; FORM.forEach(q => { Q[q.id] = q; });
  construir();
  $('estado').classList.add('hidden');
  $('form').classList.remove('hidden');
  actualizar();
  if (FORM.some(q => q.tipo === 'companero')) escucharNombres();
}

// ── Construcción dinámica ──────────────────────────────────────────────────
function el(tag, cls, txt){ const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function construir(){
  const cont = $('campos'); cont.innerHTML = '';
  let grid = null;
  const nuevaCard = (titulo) => {
    const card = el('div', 'card');
    if (titulo) card.appendChild(el('h2', null, titulo));
    grid = el('div', 'grid'); card.appendChild(grid); cont.appendChild(card);
  };
  FORM.forEach(q => {
    if (q.tipo === 'seccion'){ nuevaCard(q.etiqueta); return; }
    if (!grid) nuevaCard('');
    grid.appendChild(campo(q));
  });
  // Cards que quedaron vacías (sección sin preguntas)
  cont.querySelectorAll('.card').forEach(c => { if (!c.querySelector('.fld')) c.remove(); });
}
function campo(q){
  const w = el('div', 'fld' + (q.mitad ? ' half' : '')); w.dataset.k = q.id;
  const cid = 'c_' + q.id;
  const etq = (forId) => {
    const l = el('label', null, q.etiqueta); if (forId) l.htmlFor = forId;
    if (q.requerido){ l.appendChild(document.createTextNode(' ')); l.appendChild(el('span', 'req', '*')); }
    return l;
  };
  const opts = Array.isArray(q.opciones) ? q.opciones : [];
  if (q.tipo === 'texto'){
    w.appendChild(el('div', 'info', q.etiqueta)); return w;
  }
  if (q.tipo === 'casilla'){
    const l = el('label', 'opt'); l.style.alignItems = 'flex-start';
    const i = el('input'); i.type = 'checkbox'; i.id = cid; i.style.marginTop = '3px';
    l.appendChild(i); const sp = el('span', null, q.etiqueta + (q.requerido ? ' ' : '')); if (q.requerido) sp.appendChild(el('span', 'req', '*')); l.appendChild(sp);
    w.appendChild(l);
  } else {
    w.appendChild(etq(['radio', 'multiple'].includes(q.tipo) ? null : cid));
    if (['radio', 'multiple'].includes(q.tipo)){
      const g = el('div', 'opts');
      opts.forEach(o => {
        const l = el('label', 'opt'); const i = el('input'); i.type = q.tipo === 'radio' ? 'radio' : 'checkbox'; i.name = 'n_' + q.id; i.value = o;
        l.appendChild(i); l.appendChild(document.createTextNode(' ' + o)); g.appendChild(l);
      });
      w.appendChild(g);
    } else if (q.tipo === 'lista'){
      const s = el('select'); s.id = cid;
      s.appendChild(new Option('Seleccione…', ''));
      opts.forEach(o => s.appendChild(new Option(o, o)));
      w.appendChild(s);
    } else if (q.tipo === 'largo'){
      const t = el('textarea'); t.id = cid; t.maxLength = q.max || 1000; w.appendChild(t);
    } else if (q.tipo === 'companero'){
      const c = el('div', 'combo');
      const i = el('input'); i.type = 'text'; i.id = cid; i.maxLength = q.max || 120; i.placeholder = 'Buscar por nombre o apellido';
      i.autocomplete = 'off'; i.setAttribute('role', 'combobox'); i.setAttribute('aria-autocomplete', 'list');
      const sg = el('div', 'sugs hidden'); sg.id = 'sugs'; sg.setAttribute('role', 'listbox');
      c.appendChild(i); c.appendChild(sg); w.appendChild(c);
      enlazarBuscador(i);
    } else {
      const i = el('input'); i.id = cid;
      i.type = { fecha:'date', email:'email', tel:'tel', numero:'number' }[q.tipo] || 'text';
      if (!['fecha', 'numero'].includes(q.tipo)) i.maxLength = q.max || 200;
      if (q.tipo === 'fecha') i.min = '1900-01-01';
      if (q.tipo === 'numero') i.step = 'any';
      w.appendChild(i);
    }
  }
  if (q.ayuda) w.appendChild(el('div', 'hint', q.ayuda)).id = 'hint_' + q.id;
  w.appendChild(el('div', 'err', 'Campo obligatorio.'));
  return w;
}

// ── Lectura de valores y condiciones ───────────────────────────────────────
const hoy = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const norm = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const fechaOk = v => /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(new Date(v + 'T00:00:00'));
function leer(q){
  const c = $('c_' + q.id);
  if (q.tipo === 'radio'){ const r = document.querySelector('input[name="n_' + q.id + '"]:checked'); return r ? r.value : ''; }
  if (q.tipo === 'multiple') return [...document.querySelectorAll('input[name="n_' + q.id + '"]:checked')].map(x => x.value).join(', ');
  if (q.tipo === 'casilla') return c && c.checked ? 'Sí' : '';
  return c ? c.value.trim() : '';
}
function visible(q){
  const m = q.mostrarSi; if (!m || !m.id) return true;
  const src = Q[m.id]; if (!src || !visible(src)) return false;
  const v = leer(src), vals = Array.isArray(m.valores) ? m.valores : [];
  return src.tipo === 'multiple' ? v.split(', ').some(x => vals.includes(x)) : vals.includes(v);
}
const valorDe = id => Q[id] && visible(Q[id]) ? leer(Q[id]) : '';
function actualizar(){
  FORM.forEach(q => { if (q.tipo === 'seccion') return; const w = document.querySelector('.fld[data-k="' + q.id + '"]'); if (w) w.classList.toggle('hidden', !visible(q)); });
}
$('form').addEventListener('change', actualizar);
$('form').addEventListener('input', actualizar);

// ── Buscador de compañero ──────────────────────────────────────────────────
// NOMBRES: quienes ya enviaron el formulario (grupos/{g}/nombres, solo nombre completo, sin otros datos).
let NOMBRES = [], SEL_ID = null, SUG_IDX = -1, SUG_ITEMS = [];
function escucharNombres(){
  firebase.database().ref('grupos/' + GID + '/nombres').on('value', s => {
    NOMBRES = Object.entries(s.val() || {}).map(([id, o]) => ({ id, n: o && o.n })).filter(x => x.n);
    const i = document.querySelector('.combo input');
    if (i && document.activeElement === i) mostrarSugs(i);
  }, () => {});
}
function candidatos(){
  const yo = norm(valorDe('nombre') + ' ' + valorDe('apellido')), yoInv = norm($('invitado').value);
  const vistos = new Set(NOMBRES.map(x => norm(x.n)));
  const items = NOMBRES.filter(x => norm(x.n) !== yo && norm(x.n) !== yoInv).map(x => ({ id: x.id, n: x.n, pend: false }));
  INVITADOS.forEach(n => { const k = norm(n); if (k && !vistos.has(k) && k !== yo && k !== yoInv) items.push({ id: null, n, pend: true }); });
  return items.sort((a, b) => a.pend - b.pend || a.n.localeCompare(b.n, 'es'));
}
function mostrarSugs(inp){
  const q = norm(inp.value).split(' ').filter(Boolean);
  SUG_ITEMS = candidatos().filter(x => q.every(t => norm(x.n).includes(t))).slice(0, 8);
  SUG_IDX = -1;
  const box = $('sugs');
  if (!SUG_ITEMS.length && !q.length){ box.classList.add('hidden'); return; }
  box.innerHTML = SUG_ITEMS.length ? '' : '<div class="sug-vacio">Sin coincidencias. Puede escribir el nombre completo igualmente.</div>';
  SUG_ITEMS.forEach((x, i) => {
    const d = document.createElement('div'); d.className = 'sug'; d.setAttribute('role', 'option');
    const sp = document.createElement('span'); sp.textContent = x.n; d.appendChild(sp);
    if (x.pend){ const sm = document.createElement('small'); sm.textContent = 'aún no completó'; d.appendChild(sm); }
    d.addEventListener('mousedown', ev => { ev.preventDefault(); elegir(inp, i); });
    box.appendChild(d);
  });
  box.classList.remove('hidden');
}
function elegir(inp, i){
  const x = SUG_ITEMS[i]; if (!x) return;
  inp.value = x.n; SEL_ID = x.id;
  $('sugs').classList.add('hidden');
  const h = document.getElementById('hint_' + inp.id.slice(2));
  if (h) h.textContent = x.pend ? 'Nombre tomado de la lista de invitados.' : 'Vinculado con ' + x.n + '.';
  inp.closest('.fld').classList.remove('bad');
}
function enlazarBuscador(inp){
  inp.addEventListener('input', () => { SEL_ID = null; mostrarSugs(inp); });
  inp.addEventListener('focus', () => mostrarSugs(inp));
  inp.addEventListener('blur', () => setTimeout(() => $('sugs').classList.add('hidden'), 120));
  inp.addEventListener('keydown', ev => {
    const n = SUG_ITEMS.length; if (!n || $('sugs').classList.contains('hidden')) return;
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp'){
      ev.preventDefault(); SUG_IDX = (SUG_IDX + (ev.key === 'ArrowDown' ? 1 : -1) + n) % n;
      [...$('sugs').children].forEach((c, i) => c.classList.toggle('on', i === SUG_IDX));
    } else if (ev.key === 'Enter' && SUG_IDX >= 0){ ev.preventDefault(); elegir(inp, SUG_IDX); }
    else if (ev.key === 'Escape') $('sugs').classList.add('hidden');
  });
}

// ── Validación y envío ─────────────────────────────────────────────────────
function error(q, v){
  if (!v) return q.requerido ? (q.tipo === 'casilla' ? 'Debe aceptar para continuar.' : ['radio', 'lista', 'multiple'].includes(q.tipo) ? 'Seleccione una opción.' : q.tipo === 'companero' ? 'Indique con quién comparte.' : 'Campo obligatorio.') : '';
  if (q.tipo === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return 'Ingrese un correo válido.';
  if (q.tipo === 'numero' && isNaN(Number(v))) return 'Ingrese un número válido.';
  if (q.tipo === 'fecha'){
    if (!fechaOk(v)) return 'Ingrese una fecha válida.';
    if (q.id === 'nacimiento' && v >= hoy()) return 'Ingrese una fecha anterior a hoy.';
    if (q.id === 'emision' && v > hoy()) return 'Ingrese una fecha que no sea futura.';
    if (q.id === 'vencimiento' && v <= hoy()) return 'Ingrese una fecha posterior a hoy.';
  }
  return '';
}
function validar(){
  let ok = true;
  const inv = document.querySelector('[data-f="invitado"]');
  if (INVITADOS.length){ const bad = !$('invitado').value; inv.classList.toggle('bad', bad); if (bad) ok = false; }
  FORM.forEach(q => {
    if (['seccion', 'texto'].includes(q.tipo)) return;
    const w = document.querySelector('.fld[data-k="' + q.id + '"]'); if (!w) return;
    const msg = visible(q) ? error(q, leer(q)) : '';
    w.classList.toggle('bad', !!msg);
    if (msg){ w.querySelector('.err').textContent = msg; ok = false; }
  });
  return ok;
}

$('form').addEventListener('submit', e => {
  e.preventDefault();
  if ($('hp').value) return;   // honeypot: los bots completan este campo
  $('alerta').classList.add('hidden');
  if (!validar()){
    const primero = document.querySelector('.fld.bad, .card .fld.bad');
    if (primero) primero.scrollIntoView({ behavior:'smooth', block:'center' });
    return;
  }
  const d = { ts: Date.now() };
  if (INVITADOS.length && $('invitado').value && $('invitado').value !== OTRO) d.invitado = $('invitado').value;
  FORM.forEach(q => {
    if (['seccion', 'texto'].includes(q.tipo) || !visible(q)) return;
    const v = leer(q); if (!v) return;
    d[q.id] = q.id === 'consentimiento' ? true : v;
    if (q.tipo === 'companero' && q.id === 'compartiCon' && SEL_ID) d.compartiConId = SEL_ID;
  });
  if (!d.nombre || !d.apellido){ const a = $('alerta'); a.classList.remove('hidden'); a.textContent = 'Faltan el nombre y el apellido. Escríbanos para resolverlo.'; return; }

  const btn = $('enviar'); btn.disabled = true; btn.textContent = 'Enviando…';
  // Se guarda la respuesta completa (solo staff la lee) y, aparte, solo el nombre para el buscador de compañeros.
  const base = firebase.database().ref('grupos/' + GID);
  const rid = base.child('respuestas').push().key, up = {};
  up['respuestas/' + rid] = d;
  up['nombres/' + rid] = { n: (d.nombre + ' ' + d.apellido).slice(0, 200) };
  base.update(up).then(() => {
    mostrarMsg('Datos recibidos', 'Gracias, ' + d.nombre + '. Recibimos su información. Si necesita corregir algún dato, escríbanos.', { texto:'Cargar otro formulario', onClick: nuevoFormulario });
    window.scrollTo(0, 0);
  }, err => {
    console.error(err);
    btn.disabled = false; btn.textContent = 'Enviar datos';
    const a = $('alerta'); a.classList.remove('hidden');
    a.textContent = 'No pudimos guardar sus datos. Verifique su conexión e intente nuevamente. Si el problema continúa, escríbanos.';
  });
});
</script>
</body>
</html>
